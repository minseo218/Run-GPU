let slideIdx=0, autoTimer=null;
const askAns={};
const slidesOf=st=>[...SLIDES[st],{quiz:true,t:'확인 문제'}];
function storyGo(i,user,stepStart){
  const list=slidesOf(S.step); slideIdx=Math.max(0,Math.min(list.length-1,i));
  S.seen[S.step]=Math.max(S.seen[S.step]||0,slideIdx+1);
  save(); renderBar();
  const sl=list[slideIdx];
  if(!sl.quiz){
    S.view=sl.view||'';
    if(sl.set) Object.assign(S,typeof sl.set==='function'?sl.set():sl.set);
    if(S.step!==6) S.migFault=false;
    if(S.step===6){ S.migGis=sl.migGis?sl.migGis.map(x=>({...x})):null; S.migProcs=(sl.migProcs||[]).map(x=>({...x})); }
  }
  const changed=ensureScene(false);
  if(curScene==='card') applyBridge(TOPO(S.step)?S.bridge:true);
  numaFloor(); applyMig();
  if(!sl.quiz&&sl.go) sl.go();
  applyMigScene(); applyExplode(); applyAir(); applyPart2();
  renderCompute(); update3D(); renderLeft(); renderLive(); renderStory();
  if(!sl.quiz&&typeof hudUser!=='undefined'&&!hudUser&&hudMin&&/상황판|터미널|구조도|아래 버튼|아래 패널/.test(sl.d||'')){ hudMin=false; applyHud(); }
  if(TERM_STEPS.has(S.step)) termChips();
  fit();
  if(!sl.quiz&&sl.cam) moveCam(V(...sl.cam.p),V(...sl.cam.t)); else if(changed||stepStart) stepCam();
  if(!sl.quiz&&sl.reveal&&(changed||user)) startReveal();
  if(user) restartAuto();
}
function renderStory(){
  const list=slidesOf(S.step), sl=list[slideIdx], last=slideIdx===list.length-1, st=STEPS[S.step];
  $('#st-count').textContent=`${slideIdx+1} / ${list.length}`;
  $('#st-dots').innerHTML=list.map((s,i)=>`<button data-st="${i}" class="${i===slideIdx?'on':''}" aria-label="${i+1}번째 장면: ${s.t}" ${i===slideIdx?'aria-current="step"':''}></button>`).join('');
  let body;
  if(sl.quiz){
    const q=st.quiz, ans=S.quiz[S.step];
    body=`<h3>확인 문제</h3><div class="quiz"><p class="q">${q.q}</p><div class="qopts">${q.opts.map((o,i)=>`<button class="qopt${ans!=null?(i===q.a?' right':(i===ans?' wrong':'')):''}" data-q="${i}">${o}</button>`).join('')}</div>${ans!=null?`<p class="qres"><b>${ans===q.a?'정답입니다.':'다시 한번 봅시다.'}</b> ${q.ex}</p>`:''}</div>`;
  } else {
    body=`<h3>${sl.t}</h3><p>${sl.d}</p>${sl.extra?sl.extra():''}`;
    if(sl.ask){ const a=askAns[S.step+':'+slideIdx];
      body+=`<div class="quiz"><p class="q">${sl.ask.q}</p><div class="qopts">${sl.ask.opts.map((o,i)=>`<button class="qopt${a!=null?(i===sl.ask.a?' right':(i===a?' wrong':'')):''}" data-ask="${i}">${o}</button>`).join('')}</div>${a!=null?`<p class="qres">${sl.ask.ex}</p>`:''}</div>`; }
  }
  const b=$('#st-body'); b.innerHTML=body; b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter');
  $('#st-prev').disabled=slideIdx===0&&S.step===0;
  $('#st-next').textContent=last?(!isLast()?'다음 단계 ›':'끝'):'다음 ›';
  $('#st-next').disabled=last&&isLast();
}
function storyNav(d){
  const n=slidesOf(S.step).length;
  if(d>0){ if(slideIdx<n-1) storyGo(slideIdx+1,true); else if(!isLast()) goStep(stepBy(1)); }
  else { if(slideIdx>0) storyGo(slideIdx-1,true); else if(!isFirst()){ goStep(stepBy(-1)); storyGo(slidesOf(S.step).length-1,true); } }
}
function restartAuto(){
  clearInterval(autoTimer); autoTimer=null;
  if(!$('#st-auto').checked) return;
  autoTimer=setInterval(()=>{
    const n=slidesOf(S.step).length;
    if(slideIdx<n-1) storyGo(slideIdx+1,false); else { $('#st-auto').checked=false; clearInterval(autoTimer); autoTimer=null; }
  },7000);
}
$('#st-auto').addEventListener('change',restartAuto);
$('#st-prev').addEventListener('click',()=>storyNav(-1));
$('#st-next').addEventListener('click',()=>storyNav(1));
$('#story').addEventListener('click',e=>{
  const d=e.target.closest('[data-st]'); if(d){ storyGo(+d.dataset.st,true); return; }
  const pk=e.target.closest('[data-pick]'); if(pk){ storyGo(pk.dataset.pick==='card'?1:4,true); return; }
  const c=e.target.closest('[data-compare]'); if(c){ openCompare(c.dataset.compare); return; }
  const q=e.target.closest('[data-q]');
  if(q){ const i=+q.dataset.q; S.quiz[S.step]=i; if(i===STEPS[S.step].quiz.a) S.done[S.step]=true; save(); renderBar(); renderStory(); return; }
  const a=e.target.closest('[data-ask]'); if(a){ askAns[S.step+':'+slideIdx]=+a.dataset.ask; renderStory(); }
});
document.addEventListener('keydown',e=>{
  if(!$('#sheetwrap').hidden||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){ storyNav(1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ storyNav(-1); e.preventDefault(); }
});

/* ---- 공통 출력 ---- */
function gpuList(){
  if(S.step===1&&S.form!=='sxm') return {n:4,name:'NVIDIA A100 80GB PCIe',bus:['03','04','05','81']};
  if((TOPO(S.step)&&S.mode==='card')||S.step===2||S.step===3||S.step===5) return {n:4,name:'NVIDIA A100 80GB PCIe',bus:['03','04','05','81']};
  if(S.step===14) return {n:4,name:'NVIDIA A100-SXM4-80GB',bus:['07','0F','47','4E']};
  if(S.step===7||S.step===11) return {n:8,name:'NVIDIA H100 80GB HBM3',bus:['18','2A','3A','5D','9A','AB','BA','DB']};
  return {n:8,name:'NVIDIA A100-SXM4-80GB',bus:['07','0F','47','4E','87','90','B7','BD']};
}
const fakeUuid=(p,i)=>`${p}-${['5a1f9c3e','b2047d61','6c9e13a8','e83a5f02','1d7b6c94','a4f02e57','37c8d1b0','f19e6a4d'][i%8]}-8c1d-5a7e-${(i*4111+4096).toString(16).slice(-4)}-41d9e0c3a7b${i}`;
function smiBasic(){
  const g=gpuList(); let s=LINE+'\n'+DRV+'\n'+'| GPU  Name                     Bus-Id          Temp   Pwr:Usage/Cap |  Memory-Usage   Util |\n'+'|=========================================================================================|\n';
  for(let i=0;i<g.n;i++) s+=`| ${lpad(i,3)}  ${pad(g.name,24)} 00000000:${g.bus[i]}:00.0  ${lpad(32+(i*3)%7,2)}C   ${lpad(62+(i*5)%11,4)}W / ${g.name.includes('PCIe')?'300W':g.name.includes('H100')?'700W':'400W'} |   1MiB / 81559MiB   0% |\n`;
  s+=LINE+'\n| Processes: 실행 중인 프로세스 없음                                                         |\n'+LINE;
  return s;
}
function topoText(kind,bridge){
  const n=kind==='card'?4:8, save=S.bridge; if(bridge!==undefined) S.bridge=bridge;
  const code=(a,b)=>{ if(kind==='card') return cardLink(a,b).code; const l=sxmLink(a,b); if(l.code!=='MIG') return l.code; return swk(a)===swk(b)?'PXB':cpuOf(a)===cpuOf(b)?'NODE':'SYS'; };
  const aff=i=>kind==='card'?(i<3?['0-31,64-95','0']:['32-63,96-127','1']):(i<4?['0-63','0']:['64-127','1']);
  let s='        '+Array.from({length:n},(_,j)=>pad('GPU'+j,7)).join('')+'CPU Affinity    NUMA Affinity\n';
  for(let i=0;i<n;i++){ s+=pad('GPU'+i,8); for(let j=0;j<n;j++) s+=pad(i===j?' X':code(i,j),7); s+=pad(aff(i)[0],16)+aff(i)[1]+'\n'; }
  S.bridge=save;
  return s+'\nLegend (설명은 우리말로 옮김):\n  X    = 자기 자신\n  SYS  = CPU 소켓(NUMA 노드)을 건넘\n  NODE = 같은 NUMA 노드 안, CPU의 PCIe 출구 사이\n  PHB  = CPU의 PCIe 출구 하나를 거침\n  PXB  = PCIe 스위치 여러 단\n  PIX  = PCIe 스위치 하나\n  NV#  = NVLink 링크 #개';
}

  return `<div class="mtree"><div class="mt-top"><b>GPU 0</b> · ${migModelName()} · <span style="color:var(${S.migOn?'--mig':'--muted'})">${S.migOn?'MIG 켜짐':'MIG 꺼짐'}</span></div>

}

       <div class="grp"><span class="gl">컨테이너 CUDA</span><div class="optrow">${Object.keys(NGC).map(c=>opt('radio','ctrCuda',c,`<b>${c}</b>`,S.ctrCuda===c,'data-k="ctrCuda"')).join('')}</div></div>
       <div class="grp"><span class="gl">장애 실습</span>${Object.entries(SW_FAULTS).map(([k,f])=>`<button class="actbtn ${SW.fault===k?'':'ghost'}" data-act="p3sw:${k}">${f.n}</button>`).join('')}${SW.fault?'<button class="actbtn ghost" data-act="p3sw:none">정상으로 되돌리기</button>':''}</div>`,
  ()=>`<div class="grp"><span class="gl">작업 내기</span><button class="actbtn ghost" data-act="p3s:1">srun · GPU 1장</button><button class="actbtn ghost" data-act="p3s:4">srun · GPU 4장</button><button class="actbtn ghost" data-act="p3s:8">sbatch · GPU 8장</button><button class="actbtn ghost" data-act="p3s:16">sbatch · 2노드 × 8장</button></div>
       <div class="grp"><span class="gl">시간·노드</span><button class="actbtn" data-act="p3s:tick">가장 오래된 작업 끝내기</button><button class="actbtn ghost" data-act="p3s:drain">${SJ.drain[2]?'node03 되돌리기 (resume)':'node03 빼기 (drain)'}</button><button class="actbtn ghost" data-act="p3s:clear">모두 비우기</button></div>
       <div class="grp"><span class="gl">규칙</span>${opt('checkbox','backfill',1,'백필 켜기',S.backfill,'data-k="backfill"')}</div>
       ${partChips([['node:0','계산 노드'],['slurmctld','관리 노드']])}`,
  ()=>`<div class="grp"><span class="gl">GPU Operator 구성 요소</span>${[['k8sDrv','드라이버'],['k8sTk','Container Toolkit'],['k8sDp','디바이스 플러그인'],['k8sGfd','GPU Feature Discovery'],['k8sDcgm','DCGM 익스포터']].map(([k,n])=>opt('checkbox',k,1,n,S[k],`data-k="${k}"`)).join('')}</div>
       <div class="grp"><span class="gl">나눠 주기</span>${[['whole','GPU 통째로','nvidia.com/gpu'],['single','MIG single','모든 조각 같은 크기'],['mixed','MIG mixed','조각 크기별 자원 이름'],['ts','time-slicing','replicas 4']].map(([v,n,s])=>opt('radio','k8sShare',v,`<b>${n}</b>${s}`,S.k8sShare===v,'data-k="k8sShare"')).join('')}</div>
       <div class="grp"><span class="gl">파드 만들기</span><button class="actbtn ghost" data-act="p3k:pod-1gpu.yaml">GPU 1개 파드</button><button class="actbtn ghost" data-act="p3k:pod-4gpu.yaml">GPU 4개 파드</button><button class="actbtn ghost" data-act="p3k:pod-mig.yaml">MIG 1g.10gb 파드</button><button class="actbtn ghost" data-act="p3k:clear">파드 모두 지우기</button></div>
       <div class="grp"><span class="gl">장애 실습</span>${Object.entries(K8F).map(([k,f])=>`<button class="actbtn ${K8.fault===k?'':'ghost'}" data-act="p3k:f-${k}">${f.n}</button>`).join('')}${K8.fault?'<button class="actbtn ghost" data-act="p3k:f-none">정상으로 되돌리기</button>':''}</div>`,
  ()=>`<div class="grp"><span class="gl">지표</span>${Object.entries(MON_METRIC).map(([k,m])=>opt('radio','monMetric',k,`<b>${m.n}</b>${m.f.replace('DCGM_FI_','')}`,S.monMetric===k,'data-k="monMetric"')).join('')}</div>
       <div class="grp"><span class="gl">상황</span>${[['normal','학습 정상'],['loader','데이터 로딩 병목'],['smallk','사용률 100%의 함정'],['thermal','한 GPU 과열'],['xid','Xid 79 발생']].map(([v,n])=>opt('radio','monCase',v,`<b>${n}</b>`,S.monCase===v,'data-k="monCase"')).join('')}</div>`,
  ()=>{ const f=BFAULT[S.bringFault];
    return `<div class="grp"><span class="gl">점검 단계</span>${BSTAGES.map((b,i)=>opt('radio','bringStage',i,`<b>${BR.st[i]==='ok'?'✓ ':BR.st[i]==='fail'?'✕ ':''}${i+1}. ${b.t}</b>`,S.bringStage===i,'data-k="bringStage"')).join('')}</div>
       <div class="grp"><span class="gl">숨겨 둘 문제</span>${Object.entries(BFAULT).map(([k,b])=>opt('radio','bringFault',k,`<b>${b.n}</b>`,S.bringFault===k,'data-k="bringFault"')).join('')}</div>
       <div class="grp"><span class="gl">조치</span>${f.hw&&BR.st.includes('fail')&&!BR.fixed?`<button class="actbtn" data-act="p3b:hw">${f.hw}</button>`:''}<button class="actbtn ghost" data-act="p3b:reset">처음부터 다시</button></div>`; },
  ()=>{ const sc=TSC[S.trSc];
    return `<div class="grp"><span class="gl">시나리오</span>${Object.entries(TSC).map(([k,s])=>opt('radio','trSc',k,`<b>${s.n}</b>`,S.trSc===k,'data-k="trSc"')).join('')}</div>
       <div class="grp"><span class="gl">보기</span>${opt('checkbox','trShow',1,'고장 위치를 먼저 3D에 보이기',S.trShow,'data-k="trShow"')}</div>
       <div class="grp"><span class="gl">조치</span>${sc.hw&&TR.found&&!trFlagsClear()?`<button class="actbtn" data-act="p3t:hw">${sc.hw}</button>`:''}<button class="actbtn ghost" data-act="p3t:reset">다시 시작</button></div>`; },
  ()=>`<div class="grp"><span class="gl">마지막 점검</span><button class="actbtn ghost" data-act="p3f:reset">답 지우고 다시 풀기</button></div>`
);
SLIDES.push(
 [ {t:'앱 아래에 쌓인 층',d:`학습 코드가 GPU를 쓰려면 프레임워크(PyTorch) → 라이브러리(cuDNN, NCCL) → ${gl('[[CUDA]]')} 런타임 → ${gl('[[드라이버]]')}를 차례로 거칩니다. 흐르는 선을 따라가 보세요. GPU 호출이 내려가는 길입니다.`,set:{swCont:false,drvVer:'550',ctrCuda:'12.4'},view:'call',go:()=>swFault(null)},
   {t:'드라이버는 호스트에 하나',d:`드라이버의 중심은 커널 모듈(nvidia.ko)입니다. 그래서 서버 OS에 딱 하나만 깔립니다. 그 위의 층들은 앱마다 버전이 달라도 괜찮습니다.`,set:{swCont:false},view:'call',go:()=>{ swFault(null); S.termHl=['layer:drv']; }},
   {t:'컨테이너에는 CUDA부터 위만',d:`${gl('[[NGC]]')} 컨테이너에는 CUDA 런타임, 라이브러리, 프레임워크가 버전을 맞춰 들어 있습니다. 드라이버는 컨테이너에 넣을 수 없습니다. 대신 ${gl('[[Container Toolkit]]')}이 컨테이너를 띄울 때 호스트의 GPU와 드라이버 라이브러리를 넣어 줍니다.`,set:{swCont:true},view:'call',go:()=>{ swFault(null); S.termHl=['layer:ctk']; }},
   {t:'버전 맞추기',d:`nvidia-smi의 CUDA Version은 그 드라이버가 지원하는 <b>최대</b> CUDA 버전입니다. R470 드라이버는 11.4까지라서 CUDA 12.4 컨테이너를 올리면 돌지 않습니다. 왼쪽에서 드라이버와 컨테이너 CUDA를 바꿔 보세요.`,set:{swCont:true,drvVer:'470',ctrCuda:'12.4'},view:'call',go:()=>swFault(null)},
   {t:'장애: 업데이트 후 재부팅 안 함',d:`드라이버 패키지를 올리고 재부팅을 안 하면 라이브러리와 커널 모듈의 버전이 어긋납니다. 터미널에서 nvidia-smi를 쳐 보세요. 그다음 메모리에 어느 버전이 올라가 있는지 찾아봅니다.`,set:{swCont:true,drvVer:'550',ctrCuda:'12.4'},go:()=>swFault('mismatch')},
   {t:'장애: 컨테이너에서만 GPU가 없다',d:`호스트에서는 nvidia-smi가 되는데 docker run --gpus all은 실패합니다. 어느 층이 비었는지 찾아서 고쳐 보세요.`,set:{swCont:true,drvVer:'550',ctrCuda:'12.4'},go:()=>swFault('notk')} ],
 [ {t:'GPU를 여럿이 나눠 쓰면',d:`클러스터의 GPU는 여러 팀이 함께 씁니다. 누가 어느 GPU를 언제 쓸지 정해 주는 게 스케줄러입니다. HPC·AI 학습에서는 ${gl('[[Slurm]]')}을 많이 씁니다. 지금은 노드 4대 × GPU 8장이 모두 비어 있습니다.`,go:()=>schedPreset('empty')},
   {t:'작업은 GPU 수를 요청한다',d:`작업을 낼 때는 필요한 노드 수와 GPU 수를 적습니다(${gl('[[gres]]')}). 지금 2노드 × 8장 학습, GPU 4장 추론, GPU 2장 평가가 배정됐습니다. 같은 색 GPU가 한 작업입니다.`,view:'dispatch',go:()=>schedPreset('busy')},
   {t:'자리가 없으면 기다린다',d:`GPU 8장짜리 작업은 한 노드의 8장이 모두 비어 있어야 들어갑니다. 빈 GPU가 노드마다 조금씩 흩어져 있으면 못 들어갑니다. 그래서 뒤쪽 블록으로 보이는 대기열에서 PD (Resources) 상태로 기다립니다.`,go:()=>{ schedPreset('busy'); }},
   {t:'백필: 빈자리에 작은 작업 먼저',d:`${gl('[[백필]]')}을 켜면 큰 작업이 기다리는 동안 작은 작업을 빈자리에 먼저 넣습니다. 큰 작업의 시작을 늦추지 않는 작업만 들어갑니다. GPU 1장짜리 작업이 바로 시작한 걸 보세요. 왼쪽에서 백필을 끄면 어떻게 달라지는지도 확인해 보세요.`,set:{backfill:true},go:()=>schedPreset('backfill')},
   {t:'고장 노드 빼기: drain',d:`node03에서 Xid가 났다면 ${gl('[[drain]]')}으로 새 작업을 막습니다. 도는 작업은 끝까지 돌게 두고, 끝나면 점검합니다. 고친 뒤에는 resume으로 되돌립니다. 터미널에서 sinfo로 상태를 확인해 보세요.`,go:()=>schedPreset('drain')},
   {t:'Slurm과 Kubernetes',d:`끝이 있는 학습 작업에는 Slurm이, 계속 도는 추론 서비스에는 Kubernetes가 잘 맞습니다. 둘을 함께 쓰는 클러스터도 많습니다.`,go:()=>schedPreset('busy'),extra:()=>`<button class="linkbtn" data-compare="slurmk8s">Slurm과 Kubernetes 비교표 ›</button>`} ],
 [ {t:'쿠버네티스는 GPU를 모른다',d:`${gl('[[Kubernetes]]')}는 기본으로 CPU와 메모리만 셉니다. GPU가 꽂혀 있어도 누군가 알려 주지 않으면 노드의 GPU 자원은 0입니다. 지금은 GPU 관련 구성 요소가 하나도 없습니다.`,set:{k8sDrv:false,k8sTk:false,k8sDp:false,k8sGfd:false,k8sDcgm:false,k8sShare:'whole'},go:()=>{ k8FaultSet(null); S.k8sTk=false; k8Preset(); }},
   {t:'GPU Operator가 까는 것',d:`${gl('[[GPU Operator]]')}가 노드마다 드라이버, 툴킷, ${gl('[[디바이스 플러그인]]')}, GFD, DCGM 익스포터를 ${gl('[[DaemonSet]]')}으로 띄웁니다. 흐르는 선은 디바이스 플러그인이 "GPU 4장 있음"을 API 서버에 알리는 길입니다.`,set:{k8sDrv:true,k8sTk:true,k8sDp:true,k8sGfd:true,k8sDcgm:true,k8sShare:'whole'},view:'register',go:()=>{ k8FaultSet(null); k8Preset(); }},
   {t:'파드가 GPU를 요청한다',d:`파드 정의의 limits에 nvidia.com/gpu: 1처럼 적습니다. 그러면 스케줄러가 빈 GPU가 있는 노드에 파드를 배치하고, 디바이스 플러그인은 그 GPU만 컨테이너에 붙입니다. 같은 색 블록이 한 파드입니다.`,set:{k8sDrv:true,k8sTk:true,k8sDp:true,k8sShare:'whole'},view:'sched',go:()=>{ k8FaultSet(null); k8Preset('pods'); }},
   {t:'MIG로 쪼개 주기',d:`MIG를 켜면 GPU 한 장이 1g 조각 7개가 됩니다. single 전략은 조각을 그냥 nvidia.com/gpu로 알립니다. mixed 전략은 nvidia.com/mig-1g.10gb처럼 크기별 이름으로 알립니다. 왼쪽에서 전략을 바꾸고 MIG 파드를 만들어 보세요.`,set:{k8sDrv:true,k8sTk:true,k8sDp:true,k8sShare:'mixed'},go:()=>{ k8FaultSet(null); k8Preset(); }},
   {t:'time-slicing: 번갈아 쓰기',d:`${gl('[[time-slicing]]')}은 GPU 한 장을 복제 자원 4개로 알립니다. 파드 4개가 한 GPU를 번갈아 쓰는 것입니다. 메모리와 장애는 나뉘지 않습니다. 한 파드가 메모리를 다 쓰면 다른 파드도 죽습니다.`,set:{k8sDrv:true,k8sTk:true,k8sDp:true,k8sShare:'ts'},go:()=>{ k8FaultSet(null); k8Preset('pods'); }},
   {t:'장애: GPU가 0개로 보인다',d:`파드가 계속 Pending입니다. kubectl로 노드 자원과 gpu-operator 파드를 살펴서 원인을 찾고 고쳐 보세요.`,set:{k8sShare:'whole',k8sGfd:true,k8sDcgm:true},go:()=>{ k8FaultSet('dp'); k8Create('pod-1gpu.yaml'); }} ],
 [ {t:'지표는 어디로 흐르나',d:`${gl('[[DCGM]]')}이 GPU에서 지표를 읽으면 dcgm-exporter가 그 지표를 9400번 포트로 내놓습니다. ${gl('[[Prometheus]]')}가 이걸 긁어 가 저장하고, Grafana가 그래프를 그리고 알림을 보냅니다.`,set:{monCase:'normal',monMetric:'util'},view:'pipe'},
   {t:'사용률 100%의 함정',d:`GPU_UTIL은 "커널이 하나라도 돈 시간"의 비율입니다. 지금 8장 모두 100%입니다. 왼쪽에서 지표를 SM 활동으로 바꿔 보세요. 실제로 일한 비율은 30%가 안 됩니다.`,set:{monCase:'smallk',monMetric:'util'}},
   {t:'데이터를 기다리는 GPU',d:`사용률이 오르내리면 GPU가 데이터를 기다리는 시간이 길다는 뜻입니다. 이럴 땐 GPU를 더 사기 전에 데이터 로더, 스토리지, CPU 전처리부터 보세요.`,set:{monCase:'loader',monMetric:'util'}},
   {t:'한 장이 전체를 늦춘다',d:`GPU 5만 89°C입니다. 열 때문에 클록을 낮춰서 느려지면, 동기화할 때마다 나머지 7장이 GPU 5를 기다립니다. 오류 메시지가 없어서 온도와 클록을 봐야 알아챌 수 있습니다.`,set:{monCase:'thermal',monMetric:'temp'}},
   {t:'Xid는 바로 알림',d:`GPU 3에서 ${gl('[[Xid]]')} 79가 났습니다. 지표가 끊기고 작업이 죽어서 나머지 GPU도 놀고 있습니다. XID_ERRORS > 0 같은 알림 규칙을 걸어 두면 바로 알 수 있습니다.`,set:{monCase:'xid',monMetric:'xid'}} ],
 [ {t:'새 서버는 바로 넣지 않는다',d:`새 GPU 서버는 배송과 설치 과정에서 불량이 생기기 쉽습니다. 아래층부터 하나씩 확인하고, 모두 통과해야 클러스터에 넣습니다. 왼쪽 목록이 점검 순서입니다.`,set:{bringFault:'none'},go:()=>bringReset('none')},
   {t:'하드웨어부터',d:`BMC로 PSU, 팬, 이벤트 로그를 봅니다. 그다음 펌웨어·BIOS 버전과 ACS 같은 설정을 맞춥니다. 터미널 버튼을 눌러 1·2단계를 통과시켜 보세요.`,go:()=>bringReset('none')},
   {t:'Fabric Manager',d:`NVSwitch 서버는 ${gl('[[Fabric Manager]]')}가 GPU 사이 NVLink를 설정해야 CUDA가 됩니다. nvidia-smi는 멀쩡한데 CUDA만 안 되는 함정이 여기서 생깁니다. 3단계를 확인해 보세요.`,go:()=>{ bringReset('fm'); S.bringStage=2; }},
   {t:'DCGM 진단',d:`dcgmi diag -r 3은 30분 남짓(H100 8장 기준) 동안 메모리, PCIe, NVLink, 전력, 열을 시험합니다. 불량 GPU는 여기서 걸러집니다. 5단계를 돌려 보세요.`,go:()=>{ bringReset('mem'); S.bringStage=4; }},
   {t:'네트워크와 부하 시험',d:`ibstat과 ib_write_bw로 NIC와 케이블을 확인합니다. 여러 노드에 걸친 nccl-tests로는 전체 통신을 확인합니다. 오래 돌리는 ${gl('[[burn-in]]')}을 거치면 초기 불량이 드러납니다.`,go:()=>{ bringReset('cable'); S.bringStage=6; }},
   {t:'통과해야 투입',d:`모든 단계가 초록이 되면 scontrol update ... state=resume으로 작업을 받기 시작합니다. 왼쪽의 "숨겨 둘 문제"를 바꿔 가며 처음부터 다시 해 보세요.`,go:()=>bringReset('none')} ],
 [ {t:'층으로 좁힌다',d:`장애는 증상(앱 로그) → nvidia-smi → dmesg의 Xid → GPU 세부 → BMC·케이블 순서로 좁힙니다. 위에서부터 차례로 보면 엉뚱한 곳을 고치는 일이 줄어듭니다.`,go:()=>trReset('xid79')},
   {t:'Xid 읽기',d:`${gl('[[Xid]]')}는 드라이버가 커널 로그에 남기는 오류 번호입니다. 79는 GPU가 버스에서 떨어졌다는 뜻이고, 48은 2비트 메모리 오류, 74는 NVLink 오류입니다. 번호마다 조치가 다릅니다. 전체 표는 오른쪽 "자세히"에 있습니다.`,go:()=>trReset('xid79')},

   {t:'직접: 메모리 오류',d:`"uncorrectable ECC error"로 작업이 죽었습니다. 어느 GPU인지 찾고, ${gl('[[row remapping]]')}이 대기 중인지 확인한 뒤 GPU를 리셋해 보세요.`,go:()=>trReset('ecc')},
   {t:'직접: 오류 없이 느리다',d:`오류 메시지는 없는데 학습이 느립니다. Xid가 없을 때는 온도, 클록, BMC 센서를 봅니다. 하드웨어 문제를 찾으면 3D에 그 위치가 나타납니다.`,go:()=>trReset('thermal')},

 [ {t:'마지막 점검',d:`아래 상황판에서 23문제를 풀어 보세요. 문제는 GPU 칩 안쪽, 1부 서버 한 대, 2부 서버 여러 대, 3부 운영에서 고르게 나옵니다. 틀린 문제는 해설 옆 버튼을 눌러 그 단계로 가서 복습하면 됩니다.`} ]

function k8PodLog(p){
  if(p.st!=='Running') return {out:`Error from server (BadRequest): container "cuda" in pod "${p.name}" is waiting to start: ContainerCreating\n# 아직 배치되지 않았다. describe pod로 이유를 보자.`,err:true};
  if(K8.fault==='rtc'&&!p.rtc) return {out:'sh: 1: nvidia-smi: not found\n# GPU 도구와 드라이버 라이브러리가 컨테이너에 안 들어왔다. 어떤 런타임으로 떴는지 보자.',err:true};
  const U=k8U(), seen=[...new Set(p.units.map(u=>Math.floor(u/U)))];
  let s=seen.map((g,i)=>`GPU ${i}: NVIDIA A100-SXM4-80GB (UUID: ${fakeUuid('GPU',p.node*4+g)})`).join('\n');
  if(U===7) s=`GPU 0: NVIDIA A100-SXM4-80GB (UUID: ${fakeUuid('GPU',p.node*4+seen[0])})\n  MIG 1g.10gb     Device  0: (UUID: ${fakeUuid('MIG',p.units[0])})`;
  return {out:s+(U===4?'\n# time-slicing은 GPU 전체가 보인다. 메모리도 나눠지지 않고 다른 파드와 번갈아 쓴다.':U===7?'\n# MIG 조각 하나만 보인다. 메모리 10GB와 연산 1/7만 쓸 수 있다.':'\n# 파드 안에서는 받은 GPU만 0번부터 보인다.'),hl:['kunit']};
}

const MYTHS={"0": {"myths": [["GPU 코어 하나는 CPU 코어 하나보다 빠르다.", "반대입니다. CPU는 스레드 하나를 최대한 빨리 끝내도록, GPU는 스레드 하나의 속도를 조금 포기하는 대신 수천 개를 동시에 돌려 전체 처리량을 높이도록 설계됩니다."], ["딥러닝 계산은 모두 CUDA 코어가 맡는다.", "행렬 곱셈-누산은 텐서 코어가 작은 행렬 블록 단위로 빠르게 처리합니다. 원소별 덧셈처럼 행렬 블록으로 나타낼 수 없는 계산은 CUDA 코어가 맡습니다."], ["GPU가 있으면 CPU는 거의 할 일이 없다.", "CUDA 프로그램은 항상 CPU에서 시작하고, CPU 쪽 코드가 데이터를 GPU 메모리로 옮기고 GPU에 일을 시킵니다. CPU와 GPU를 둘 다 바쁘게 쓸 때 성능이 가장 좋습니다."]], "refs": [["CUDA 프로그래밍 가이드 1.1 소개 (CPU와 GPU의 설계 차이)", "https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/introduction.html"], ["CUDA 프로그래밍 가이드 1.2 프로그래밍 모델 (호스트와 디바이스)", "https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html"], ["NVIDIA 딥러닝 성능 가이드: GPU 성능 배경 (텐서 코어, A100 구성)", "https://docs.nvidia.com/deeplearning/performance/dl-performance-gpu-background/index.html"], ["NVIDIA A100 제품 페이지 (메모리 용량·대역폭)", "https://www.nvidia.com/en-us/data-center/a100/"]]}, "1": {"myths": [["SXM GPU도 카드형처럼 메인보드 슬롯에 꽂는다.", "SXM GPU는 HGX 같은 GPU 전용 보드에 올라갑니다. 슬롯에 꽂는 것은 PCIe 카드형입니다."], ["이름이 같은 GPU라면 PCIe형과 SXM형의 성능과 전력도 같다.", "H100 SXM은 최대 700W에 NVLink 900GB/s이고, PCIe형인 H100 NVL은 350~400W에 NVLink 600GB/s입니다. 같은 이름이라도 형태마다 사양이 다릅니다."], ["PSU가 하나만 고장 나도 서버가 바로 꺼진다.", "DGX H100은 PSU 6개를 4+2 이중화로 씁니다. 3개만 전기가 들어와도 성능을 낮춰 계속 돌지만, 고장 난 PSU는 바로 바꿔야 합니다."]], "refs": [["NVIDIA DGX H100/H200 사용자 가이드: 시스템 소개 (부품, BMC, 전원 사양)", "https://docs.nvidia.com/dgx/dgxh100-user-guide/introduction-to-dgxh100.html"], ["NVIDIA H100 제품 페이지 (SXM과 NVL(PCIe) 사양 비교)", "https://www.nvidia.com/en-us/data-center/h100/"], ["NVIDIA A100 제품 페이지 (PCIe형과 SXM형 사양 비교)", "https://www.nvidia.com/en-us/data-center/a100/"], ["NVIDIA HGX 플랫폼 소개", "https://www.nvidia.com/en-us/data-center/hgx/"]]}, "2": {"myths": [["PCIe Gen5 x16의 128GB/s는 한 방향 속도다.", "128GB/s는 양방향을 합친 값이고 한 방향으로는 64GB/s입니다. Gen4 x16도 합계 64GB/s, 한 방향 32GB/s입니다."], ["nvidia-smi에 PCIe 세대나 레인 수가 낮게 나오면 고장이다.", "현재 값(Current)은 GPU가 쉬고 있을 때 낮아질 수 있습니다. 최대 값(Max)과 비교하고, GPU가 일할 때 다시 확인합니다."], ["PCIe 세대가 다른 장치와 슬롯은 함께 쓸 수 없다.", "PCIe는 이전 세대와 호환됩니다. GPU가 지원하는 세대가 시스템보다 높으면 시스템이 지원하는 세대로 연결됩니다."]], "refs": [["PCI-SIG: PCI Express 6.0 사양 소개 (속도, 이전 세대 호환)", "https://pcisig.com/pci-express-6.0-specification"], ["NVIDIA Hopper 아키텍처 심층 분석 (PCIe Gen5·Gen4 방향별 대역폭)", "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"], ["nvidia-smi 문서 (PCIe 링크 세대·폭의 Current와 Max)", "https://docs.nvidia.com/deploy/nvidia-smi/index.html"]]}, "3": {"myths": [["2소켓 서버에서는 어느 CPU가 어느 메모리를 읽어도 속도가 같다.", "같은 노드의 메모리를 읽을 때가 다른 노드의 메모리를 읽을 때보다 빠르고 대역폭도 큽니다. 그래서 작업과 메모리를 같은 노드에 두는 것이 중요합니다."], ["다른 NUMA 노드의 메모리나 장치는 아예 쓸 수 없다.", "쓸 수 있습니다. 리눅스가 다루는 ccNUMA 시스템에서는 어느 CPU에서나 모든 메모리에 접근할 수 있고, 다만 멀수록 느립니다."], ["GPU는 서버의 모든 CPU와 똑같이 가깝다.", "GPU마다 가까운 CPU와 NUMA 노드가 정해져 있습니다. nvidia-smi topo -m의 affinity 열이나 nvidia-smi topo -C로 확인합니다."]], "refs": [["리눅스 커널 문서: What is NUMA?", "https://docs.kernel.org/mm/numa.html"], ["리눅스 커널 문서: NUMA 메모리 정책", "https://docs.kernel.org/admin-guide/mm/numa_memory_policy.html"], ["nvidia-smi 문서 (topo -m의 CPU·메모리 affinity, topo -C)", "https://docs.nvidia.com/deploy/nvidia-smi/index.html"]]}, "4": {"myths": [["H100의 NVLink 900GB/s는 한 방향 속도다.", "900GB/s는 링크 18개의 양방향 합계입니다. 링크 하나는 방향마다 25GB/s라서, 한 방향만 보면 그 절반입니다."], ["NVLink는 GPU와 GPU 사이에만 쓰인다.", "NVLink를 칩 사이 연결로 넓힌 NVLink-C2C는 GB200 슈퍼칩에서 Grace CPU와 Blackwell GPU를 잇습니다. 그래서 주로 GPU끼리 쓴다고 말하는 것이 정확합니다."], ["카드형 GPU도 NVLink 브리지를 끼우면 8장을 모두 NVLink로 묶을 수 있다.", "A100 PCIe형의 NVLink 브리지는 GPU 2장까지만 잇습니다. 여러 장을 모두 NVLink로 잇는 것은 NVSwitch가 있는 SXM(HGX) 보드입니다."]], "refs": [["NVIDIA NVLink·NVLink Switch 소개와 세대별 사양", "https://www.nvidia.com/en-us/data-center/nvlink/"], ["NVIDIA Hopper 아키텍처 심층 분석 (NVLink 4세대 링크 수·대역폭)", "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"], ["NVIDIA NVLink-C2C 소개", "https://www.nvidia.com/en-us/data-center/nvlink-c2c/"], ["NVIDIA A100 제품 페이지 (PCIe형 NVLink 브리지는 2장까지)", "https://www.nvidia.com/en-us/data-center/a100/"]]}, "19": {"myths": [["topo -m의 NV12는 두 GPU가 선 12개로 직접 이어져 있다는 뜻이다.", "NV#은 NVLink #개를 묶은 연결을 지난다는 뜻입니다. HGX A100에서는 GPU마다 NVSwitch 6개에 링크를 2개씩 내고, 그 스위치를 거쳐 통신합니다."], ["topo -m에 PIX나 PXB로 나오면 P2P는 당연히 된다.", "topo -m은 길의 종류만 보여 주고, P2P가 되는지는 nvidia-smi topo -p2p로 따로 봅니다. PCIe 스위치에 ACS가 켜져 있으면 P2P 트래픽이 CPU 쪽으로 돌아갈 수 있습니다."], ["topo -m 코드만 보면 GPU 쌍의 실제 속도를 알 수 있다.", "코드는 연결 방식을 나타낼 뿐 측정값이 아닙니다. 실제 대역폭은 nvbandwidth 같은 측정 도구로 잽니다."]], "refs": [["nvidia-smi 문서 (topo -m 범례, topo -p2p)", "https://docs.nvidia.com/deploy/nvidia-smi/index.html"], ["NVIDIA Fabric Manager 사용자 가이드 (HGX 보드의 GPU·NVSwitch 연결 구조)", "https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html"], ["NCCL 문서: GPU 문제 해결 (P2P, ACS, 토폴로지)", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/gpu_troubleshooting.html"], ["NVIDIA nvbandwidth (GPU 대역폭 측정 도구)", "https://github.com/NVIDIA/nvbandwidth"]]}, "5": {"myths": [["ACS를 켜 두면 GPU 사이 통신이 더 안전하고 빨라진다.", "ACS는 PCIe 장치 사이 트래픽을 모두 CPU 루트 컴플렉스로 돌려서 성능을 크게 떨어뜨릴 수 있습니다. 베어메탈에서는 PCIe 스위치의 ACS를 끄라고 안내하지만, 가상머신은 ACS가 있어야 동작합니다."], ["P2P가 안 되면 GPU끼리 데이터를 아예 주고받지 못한다.", "주고받을 수는 있습니다. P2P가 켜져 있지 않으면 복사가 호스트(CPU 메모리)를 거쳐 가서 느려질 뿐입니다."], ["리눅스 베어메탈 서버에서도 IOMMU를 켠 채로 GPU P2P를 써도 된다.", "CUDA 문서는 리눅스 베어메탈에서 IOMMU를 켠 PCIe P2P를 지원하지 않으며, 조용한 메모리 손상을 막으려면 IOMMU를 꺼야 한다고 안내합니다. 가상머신에 GPU를 넘길 때는 반대로 IOMMU를 켭니다."]], "refs": [["CUDA 프로그래밍 가이드 3.4 다중 GPU 시스템 (P2P, IOMMU, ACS)", "https://docs.nvidia.com/cuda/cuda-programming-guide/03-advanced/multi-gpu-systems.html"], ["NCCL 문서: GPU 문제 해결 (ACS·IOMMU 확인과 해제)", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/gpu_troubleshooting.html"], ["GPUDirect RDMA 문서", "https://docs.nvidia.com/cuda/gpudirect-rdma/index.html"], ["NVIDIA GPUDirect 소개 (P2P, RDMA, Storage)", "https://developer.nvidia.com/gpudirect"]]}, "6": {"myths": [["NVIDIA GPU라면 어떤 모델이든 MIG로 나눌 수 있다.", "MIG는 Ampere 세대 이후 GPU 가운데 지원 목록에 있는 제품(A100, A30, H100, H200, B200 등)에서만 됩니다. 나눌 수 있는 개수도 제품마다 달라서 A30은 최대 4개입니다."], ["MPS를 쓰면 한 프로그램이 오류로 죽어도 같은 GPU의 다른 프로그램은 멀쩡하다.", "MPS의 오류 격리는 제한적입니다. 한 클라이언트가 치명적 GPU 오류를 내면 같은 GPU를 쓰던 클라이언트 모두에게 알려지고, 그 클라이언트들은 종료해야 합니다."], ["MIG 모드는 한 번 켜면 재부팅해도 항상 그대로 남는다.", "Ampere GPU는 재부팅해도 유지되지만, Hopper부터는 드라이버가 올라와 있는 동안만 유지되고 재부팅하면 풀립니다. 대신 Hopper부터는 MIG를 켤 때 GPU 리셋이 필요 없습니다."]], "refs": [["NVIDIA MIG 사용자 가이드: 지원 GPU", "https://docs.nvidia.com/datacenter/tesla/mig-user-guide/latest/supported-gpus.html"], ["NVIDIA MIG 사용자 가이드: 시작하기 (MIG 모드 켜기, Hopper 이후 동작)", "https://docs.nvidia.com/datacenter/tesla/mig-user-guide/latest/getting-started-with-mig.html"], ["NVIDIA MPS 문서: When to Use MPS (메모리 보호와 오류 격리)", "https://docs.nvidia.com/deploy/mps/latest/when-to-use-mps.html"], ["NVIDIA vGPU 소프트웨어 문서", "https://docs.nvidia.com/vgpu/index.html"]]}, "11": {"myths": [["링 all-reduce에서는 GPU 수가 늘수록 GPU마다 보내는 양도 그만큼 늘어난다.", "all-reduce 시간은 (데이터 크기 ÷ GPU 하나의 대역폭) × 2(n−1)/n 입니다. GPU가 많아져도 이 계수는 2에 가까워질 뿐 계속 커지지 않습니다."], ["데이터 병렬(DP)만 늘리면 한 장에 안 들어가던 모델도 들어간다.", "DP는 GPU마다 모델 전체를 복제합니다. 모델을 나눠 GPU 한 장의 메모리를 줄이려면 텐서 병렬이나 파이프라인 병렬 같은 모델 병렬을 씁니다."], ["텐서 병렬은 서버 여러 대에 걸쳐 나눠도 성능 차이가 없다.", "NVIDIA Megatron 가이드는 텐서 병렬을 NVLink로 이어진 서버 한 대 안에 두고(최대 8), 서버 사이는 파이프라인 병렬로 나누라고 권합니다."]], "refs": [["NCCL 문서: 집합 통신 (AllReduce 등)", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/collectives.html"], ["nccl-tests 성능 지표 설명 (algbw·busbw, 2(n−1)/n)", "https://github.com/NVIDIA/nccl-tests/blob/master/doc/PERFORMANCE.md"], ["NVIDIA Megatron Bridge 병렬화 가이드 (DP·TP·PP, 하드웨어별 권장)", "https://docs.nvidia.com/nemo/megatron-bridge/latest/parallelisms.html"], ["NVIDIA Megatron-LM 저장소", "https://github.com/NVIDIA/Megatron-LM"]]}, "7": {"myths": [["NIC 속도가 400 Gb/s면 초당 400GB를 보낸다.", "네트워크 속도의 b는 비트입니다. NDR InfiniBand는 한 방향 최대 400 Gbps이고, 8비트가 1바이트라서 바이트로 바꾸려면 8로 나눕니다."], ["GPU와 NIC가 서버 어디에 꽂혀 있든 GPUDirect RDMA 성능은 같다.", "GPU와 NIC 사이에 PCIe 스위치만 있을 때 가장 빠르고, CPU를 거치면 느려집니다. CPU 소켓 사이 연결까지 건너면 매우 느리거나 불안정할 수 있습니다."], ["RoCE는 이더넷이라 일반 이더넷처럼 꽂기만 하면 InfiniBand처럼 동작한다.", "NCCL 문서는 RoCE 성능 문제가 링크 고장보다 혼잡 제어나 무손실 설정(PFC, ECN)과 얽힌 경우가 많다고 설명합니다. 스위치와 NIC 설정을 함께 맞춰야 합니다."]], "refs": [["GPUDirect RDMA 문서 (GPU와 NIC 사이 경로별 성능)", "https://docs.nvidia.com/cuda/gpudirect-rdma/index.html"], ["NCCL 문서: 네트워크 문제 해결 (InfiniBand, RoCE)", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/networking_troubleshooting.html"], ["DGX SuperPOD H100 참조 아키텍처: 주요 구성 요소 (NDR InfiniBand 속도)", "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/dgx-superpod-components.html"], ["NVIDIA InfiniBand 어댑터 (ConnectX-7 400Gb/s)", "https://www.nvidia.com/en-us/networking/infiniband-adapters/"]]}, "8": {"myths": [["DPU는 AI 모델 계산을 빠르게 해 주는 또 하나의 GPU다.", "DPU(BlueField)는 네트워크, 스토리지, 보안 같은 인프라 처리를 맡는 플랫폼입니다. 모델 학습과 추론 계산은 GPU가 합니다."], ["SuperNIC와 DPU는 같은 제품을 부르는 다른 이름이다.", "SuperNIC는 GPU 서버 사이의 GPU-to-GPU 통신을 빠르게 하는 데 집중한 네트워크 카드이고, DPU는 네트워크·스토리지·보안 처리까지 맡는 인프라 플랫폼입니다."], ["DPU의 보안 기능도 서버 OS 위에서 돌아서 서버가 뚫리면 함께 무력화된다.", "BlueField 공식 소개는 호스트가 뚫린 경우에도 BlueField에서 대역 외(out-of-band)로 감시하고 위협을 격리하는 보안 기능을 설명합니다."]], "refs": [["NVIDIA BlueField 네트워킹 플랫폼 (DPU)", "https://www.nvidia.com/en-us/networking/products/data-processing-unit/"], ["NVIDIA Ethernet SuperNIC", "https://www.nvidia.com/en-us/networking/products/ethernet/supernic/"]]}, "9": {"myths": [["레일 최적화는 서버 한 대의 GPU 8장을 같은 스위치에 모으는 배치다.", "여러 서버에서 같은 번호(같은 레일)의 GPU와 NIC를 같은 리프 스위치에 모으는 배치입니다. DGX SuperPOD H100은 32대씩 레일을 맞춥니다."], ["레일 최적화를 하면 어느 GPU 사이든 스위치 한 번에 닿는다.", "한 번에 닿는 것은 같은 확장 단위(SU) 안에서 같은 레일끼리입니다. 다른 레일 사이 통신은 스파인 계층을 거칩니다."], ["학습 통신, 스토리지, 관리 트래픽은 네트워크 하나로 합쳐도 된다.", "DGX SuperPOD는 계산 패브릭, 스토리지 패브릭, 인밴드 관리망, 대역 외(OOB) 관리망 네 가지를 따로 둡니다. OOB망은 보안을 위해 논리적으로 분리합니다."]], "refs": [["DGX SuperPOD H100 참조 아키텍처: 네트워크 패브릭 (레일 정렬, 네트워크 4종)", "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/network-fabrics.html"], ["DGX SuperPOD H100 참조 아키텍처: 스토리지 구조", "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/storage-architecture.html"], ["DGX SuperPOD H100 참조 아키텍처: 전체 구조 (SU와 랙 배치)", "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/dgx-superpod-architecture.html"]]}, "10": {"myths": [["GPU 서버 전력은 GPU 전력만 더하면 된다.", "H100 SXM은 장당 최대 700W인데, DGX H100 한 대의 최대 전력은 10.2kW로 GPU 8장을 합친 것보다 훨씬 큽니다. 전력은 시스템 사양서의 최대값으로 계획합니다."], ["랙에 서버를 몇 대 넣을지는 랙 높이(U)만 따지면 된다.", "NVIDIA 설계 가이드는 전력, 냉각, 공간을 세 가지 제약으로 봅니다. DGX H100은 랙당 1대, 2대, 4대 배치를 두고 데이터센터의 전력과 냉각 용량에 맞춰 고릅니다."], ["수랭 랙이면 팬과 공랭 설비가 전혀 필요 없다.", "DGX GB200 랙도 CPU와 GPU는 냉각판을 지나는 냉각수로 식히지만, 네트워크·스토리지 부품은 팬 바람으로 식힙니다. 이런 랙은 한 대가 약 120kW를 씁니다."]], "refs": [["DGX SuperPOD 데이터센터 설계(H100): 배치 계획 (랙당 대수와 전력)", "https://docs.nvidia.com/dgx-superpod/design-guides/dgx-superpod-data-center-design-h100/latest/planning.html"], ["DGX GB 랙 시스템 사용자 가이드: 하드웨어 (수랭 구성, 랙 전력)", "https://docs.nvidia.com/dgx/dgxgb200-user-guide/hardware.html"], ["DGX H100/H200 사용자 가이드: 시스템 소개 (전원 사양, PSU 이중화)", "https://docs.nvidia.com/dgx/dgxh100-user-guide/introduction-to-dgxh100.html"], ["NVIDIA H100 제품 페이지 (GPU 최대 전력)", "https://www.nvidia.com/en-us/data-center/h100/"]]}, "12": {"myths": [["nvidia-smi 오른쪽 위의 CUDA Version은 서버에 설치된 CUDA 툴킷 버전이다.", "그 드라이버가 지원하는 가장 높은 CUDA 버전입니다. 설치된 툴킷 버전과 같을 때가 많지만 항상 같지는 않습니다."], ["GPU 드라이버도 앱 컨테이너 이미지 안에 넣어야 한다.", "드라이버는 호스트에 설치합니다. NVIDIA Container Toolkit이 컨테이너를 띄울 때 GPU 장치와 GPU 지원을 컨테이너에 넣어 줍니다."], ["메이저 버전만 같으면 새 CUDA 앱이 오래된 드라이버에서도 모든 기능 그대로 돈다.", "마이너 버전 호환은 최소 요구 드라이버 이상에서 기능이 제한된 채로 돌게 해 줍니다. 특히 PTX로 컴파일한 코드는 오래된 드라이버에서 돌지 않아 드라이버를 올려야 합니다."]], "refs": [["nvidia-smi 문서 (CUDA 버전 항목의 뜻)", "https://docs.nvidia.com/deploy/nvidia-smi/index.html"], ["CUDA 호환성: 마이너 버전 호환", "https://docs.nvidia.com/deploy/cuda-compatibility/latest/minor-version-compatibility.html"], ["NVIDIA Container Toolkit 구조 개요", "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/arch-overview.html"], ["NVIDIA Container Toolkit 설치 가이드 (호스트 드라이버 선행 설치)", "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html"]]}, "13": {"myths": [["노드를 drain하면 그 노드에서 돌던 작업이 바로 멈춘다.", "drain은 새 작업 배정만 막습니다. 돌던 작업은 끝까지 돌고(DRAINING), 마지막 작업이 끝나면 DRAINED 상태가 됩니다."], ["백필은 작은 작업을 먼저 끼워 넣느라 큰 작업을 늦춘다.", "백필은 우선순위가 높은 작업의 예상 시작 시각을 늦추지 않을 때만 낮은 우선순위 작업을 먼저 시작합니다."], ["squeue에 PD로 보이면 작업에 문제가 생긴 것이다.", "PD는 대기 중이라는 뜻입니다. 사유가 Resources면 요청한 자원이 아직 비지 않은 것이고, Priority면 우선순위가 더 높은 작업이 있는 것입니다."]], "refs": [["Slurm sinfo 문서 (DRAINING·DRAINED 상태)", "https://slurm.schedmd.com/sinfo.html"], ["Slurm 스케줄링 설정 가이드 (백필)", "https://slurm.schedmd.com/sched_config.html"], ["Slurm 작업 대기 사유 코드", "https://slurm.schedmd.com/job_reason_codes.html"], ["Slurm GRES 스케줄링 (GPU 배정, CUDA_VISIBLE_DEVICES)", "https://slurm.schedmd.com/gres.html"]]}, "14": {"myths": [["쿠버네티스는 노드에 꽂힌 GPU를 알아서 인식한다.", "관리자가 노드에 GPU 드라이버를 깔고 GPU 회사의 디바이스 플러그인을 띄워야 nvidia.com/gpu 같은 자원이 생깁니다."], ["GPU를 0.5개처럼 쪼개서 요청할 수 있다.", "GPU 같은 확장 자원은 정수로만 요청할 수 있고 오버커밋도 안 됩니다. 나눠 쓰려면 MIG나 time-slicing으로 자원을 따로 만듭니다."], ["time-slicing으로 나눠 주면 MIG처럼 메모리와 장애가 격리된다.", "time-slicing의 복제 자원 사이에는 메모리 격리도 장애 격리도 없습니다. 하드웨어 수준의 격리가 필요하면 MIG를 씁니다."]], "refs": [["Kubernetes 문서: Schedule GPUs", "https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/"], ["Kubernetes 문서: Device Plugins (정수 자원, 공유 불가)", "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/device-plugins/"], ["NVIDIA GPU Operator: Time-Slicing GPUs in Kubernetes", "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/gpu-sharing.html"], ["NVIDIA GPU Operator: GPU Operator with MIG", "https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/gpu-operator-mig.html"]]}, "15": {"myths": [["GPU 사용률(GPU_UTIL)이 100%면 GPU를 꽉 채워 쓰고 있다.", "GPU 사용률은 샘플 기간 중 커널이 하나라도 돈 시간의 비율입니다. SM이 얼마나 바빴는지는 DCGM의 SM 활동 지표로 따로 봅니다."], ["nvidia-smi의 메모리 사용률(Memory Util)은 GPU 메모리를 얼마나 채웠는지를 뜻한다.", "메모리 사용률은 샘플 기간 중 GPU 메모리를 읽거나 쓴 시간의 비율입니다. 얼마나 채웠는지는 메모리 사용량(FB Used) 지표로 봅니다."], ["Xid 오류가 없으면 GPU 성능에는 문제가 없다.", "온도가 높거나 전력 한도에 걸리면 오류 없이 클록이 낮아집니다. nvidia-smi의 클록 저하 사유(Clocks Event Reasons)에서 열·전력 때문인지 확인합니다."]], "refs": [["DCGM 기능 개요 (프로파일링 지표 정의)", "https://docs.nvidia.com/datacenter/dcgm/latest/user-guide/feature-overview.html"], ["DCGM 필드 식별자 (필드 이름과 번호)", "https://docs.nvidia.com/datacenter/dcgm/latest/reference/field-identifiers.html"], ["nvidia-smi 문서 (사용률 정의, 클록 저하 사유)", "https://docs.nvidia.com/deploy/nvidia-smi/index.html"], ["NVIDIA dcgm-exporter 저장소", "https://github.com/NVIDIA/dcgm-exporter"]]}, "16": {"myths": [["nvidia-smi에 GPU가 모두 보이면 CUDA도 바로 쓸 수 있다.", "NVSwitch 서버는 Fabric Manager가 NVLink를 설정해야 합니다. HGX A100 같은 시스템은 그전에 앱을 띄우면 cudaErrorSystemNotReady로 실패하고, H100 이후는 GPU가 NVLink 패브릭 등록을 마친 뒤에야 CUDA 초기화가 시작됩니다."], ["dcgmi diag -r 1만 통과하면 하드웨어 검증이 끝난 것이다.", "-r 1은 Hopper 시스템 기준 2.5초도 안 걸리는 소프트웨어 점검입니다. PCIe·NVLink·메모리 시험은 -r 2부터, 스트레스·전력 시험은 -r 3부터 들어갑니다."], ["GPUDirect RDMA는 드라이버만 설치하면 저절로 켜진다.", "nvidia-peermem 커널 모듈을 노드가 부팅할 때마다 올려야 합니다. 최근 커널과 오픈 GPU 드라이버에서는 DMA-BUF로 이 모듈 없이 쓸 수 있습니다."]], "refs": [["NVIDIA Fabric Manager 사용자 가이드", "https://docs.nvidia.com/datacenter/tesla/fabric-manager-user-guide/index.html"], ["DCGM 진단 (dcgmi diag 실행 레벨과 시험 항목)", "https://docs.nvidia.com/datacenter/dcgm/latest/user-guide/dcgm-diagnostics.html"], ["NCCL 문서: GPU 문제 해결 (GPUDirect RDMA, ACS, IOMMU)", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/troubleshooting/gpu_troubleshooting.html"], ["NVIDIA nccl-tests 저장소", "https://github.com/NVIDIA/nccl-tests"]]}, "17": {"myths": [["Xid가 찍히면 무조건 GPU 하드웨어 고장이다.", "Xid는 하드웨어, NVIDIA 소프트웨어, 사용자 앱 문제를 모두 알릴 수 있습니다. 예를 들어 Xid 13과 31은 대개 앱 버그라서 카탈로그의 1차 조치가 앱 재시작입니다."], ["row remapping은 메모리 오류가 난 그 자리에서 바로 적용된다.", "row remapping은 GPU를 리셋해야 적용됩니다. 대기 중(pending)인 remapping은 GPU 리셋 뒤에 반영됩니다."], ["Xid 79(GPU가 버스에서 떨어짐)는 nvidia-smi -r로 그 GPU만 리셋하면 해결된다.", "Xid 카탈로그의 1차 조치는 시스템 재시작(RESTART_BM)입니다. PCIe 링크나 GPU 하드웨어 고장이 원인인 경우가 많아 시스템·커널 로그를 함께 봅니다."]], "refs": [["Xid 오류 문서: 소개", "https://docs.nvidia.com/deploy/xid-errors/latest/introduction.html"], ["Xid 오류 문서: Xid 카탈로그 (번호별 조치 분류)", "https://docs.nvidia.com/deploy/xid-errors/latest/analyzing-xid-catalog.html"], ["GPU 메모리 오류 관리: Row Remapping", "https://docs.nvidia.com/deploy/a100-gpu-mem-error-mgmt/latest/row-remapping.html"], ["NVIDIA GPU 디버그 가이드라인", "https://docs.nvidia.com/deploy/gpu-debug-guidelines/index.html"]]}, "18": {"myths": [], "refs": [["NVIDIA 인증: AI Infrastructure and Operations (NCA-AIIO, 출제 비중)", "https://www.nvidia.com/en-us/learn/certification/ai-infrastructure-operations-associate/"], ["NVIDIA 인증: AI Infrastructure (NCP-AII)", "https://www.nvidia.com/en-us/learn/certification/ai-infrastructure-professional/"]]}, "20": {"myths": [["H100 칩의 SM 144개는 모두 켜져 있다.", "144개는 GH100 칩 전체 구성입니다. 실제 H100 SXM5 제품은 SM 132개, PCIe형은 114개를 씁니다."], ["GPC, TPC, SM은 같은 것을 부르는 다른 이름이다.", "층층이 묶인 단위입니다. GH100 전체 칩은 GPC 8개, TPC 72개(GPC당 9개), TPC당 SM 2개로 SM이 144개입니다."], ["CUDA 코어와 텐서 코어는 이름만 다를 뿐 같은 일을 한다.", "H100 SM 하나에는 FP32 CUDA 코어 128개와 텐서 코어 4개가 있습니다. 텐서 코어는 작은 행렬 블록의 곱셈-누산을 맡고, 행렬로 나타낼 수 없는 계산은 CUDA 코어가 합니다."]], "refs": [["NVIDIA Hopper 아키텍처 심층 분석 (GH100의 GPC·TPC·SM 구성)", "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"], ["NVIDIA H100 GPU 백서", "https://resources.nvidia.com/en-us-hopper-architecture/nvidia-h100-tensor-c"], ["NVIDIA 딥러닝 성능 가이드: GPU 성능 배경 (텐서 코어와 CUDA 코어)", "https://docs.nvidia.com/deeplearning/performance/dl-performance-gpu-background/index.html"], ["CUDA 프로그래밍 가이드 1.2 프로그래밍 모델 (SM과 스레드 블록)", "https://docs.nvidia.com/cuda/cuda-programming-guide/01-introduction/programming-model.html"]]}, "21": {"myths": [["GPU 메모리(HBM)가 GPU 안에서 가장 빠른 저장 공간이다.", "레지스터와 공유 메모리는 SM 안에 있어서 HBM(글로벌 메모리)보다 지연이 짧고 대역폭이 큽니다. 대신 크기는 훨씬 작습니다."], ["L2 캐시는 SM마다 따로 하나씩 있다.", "SM마다 따로 있는 것은 L1·공유 메모리(H100은 SM당 합쳐 256KB)입니다. L2는 모든 SM이 함께 쓰며 H100은 50MB입니다."], ["연산 성능(TFLOPS)이 높은 GPU면 모든 계산이 그만큼 빨라진다.", "계산량에 비해 메모리를 많이 읽는 연산(산술 강도가 낮은 연산)은 메모리 대역폭에 막힙니다. 원소별 연산, 정규화, 활성화 함수가 대표적이고, 루프라인 차트로 어느 쪽에 막혔는지 봅니다."]], "refs": [["NVIDIA Hopper 튜닝 가이드 (L1·공유 메모리, L2 용량)", "https://docs.nv   return {P,stateGB,need,tp,pp,rep,gpus,srv,racks,kw,leaf,spine,tokens,flops,days};
}

SLIDES[23]=[
  {t:'숫자를 비트로 적는 법',d:`컴퓨터는 실수를 세 부분으로 나눠 적습니다. 십진수로 치면 1.23 × 10⁵ 같은 꼴입니다. 빨간 칸은 부호(+/−)입니다. 주황 칸은 지수로, 10⁵의 5처럼 얼마나 크거나 작은 수까지 적을지(범위)를 정합니다. 파란 칸은 가수로, 1.23처럼 몇 자리까지 정확하게 적을지(정밀도)를 정합니다. FP32는 32비트, 4바이트입니다.`,set:{dt:'fp32',dtMode:'infer'},go:hl('dte','dtm')},
  {t:'BF16과 FP16',d:`둘 다 16비트(2바이트)인데 나누는 법이 다릅니다. ${gl('[[BF16]]')}은 지수를 FP32와 같은 8비트로 둬서 범위가 같고, 대신 정밀도를 줄였습니다. FP16은 더 정밀하지만 범위가 좁습니다. 가장 큰 수가 65,504이고, 아주 작은 기울기는 0이 되어 사라집니다. 그래서 FP16으로 학습할 때는 값을 일부러 키워 계산하는 손실 스케일링이 필요합니다. 그래서 요즘 대형 모델 학습은 BF16을 주로 씁니다.`,set:{dt:'bf16'},go:hl('dte')},
  {t:'TF32: 텐서 코어용 FP32',d:`TF32는 메모리에는 FP32로 두고, 텐서 코어가 곱할 때만 가수를 10비트로 줄여 계산하는 방식입니다. 회색 칸이 계산할 때 버리는 비트입니다. 코드를 거의 안 바꾸고 FP32 행렬 곱을 빠르게 할 수 있고, 프레임워크 설정으로 켜고 끕니다.`,set:{dt:'tf32'},go:hl('dtx')},
  {t:'FP8과 INT8',d:`8비트, 1바이트 형식입니다. H100은 ${gl('[[FP8]]')} 텐서 코어로 BF16의 2배 성능을 냅니다. FP8 학습은 보통 답을 계산하는 쪽에 E4M3을, 기울기에는 범위가 더 넓은 E5M2를 씁니다. 둘 다 범위가 좁아서 행렬마다 배율(scale)을 곱해 값을 범위 안에 맞춥니다. INT8은 주로 추론 ${gl('[[양자화]]')}에 씁니다. 아래 상황판에서 형식별 성능을 비교해 보세요.`,set:{dt:'fp8e4'},go:hl()},
  {t:'추론 메모리 = 파라미터 × 바이트',d:`추론에는 가중치만 있으면 됩니다. 70B 모델을 BF16으로 올리면 70B × 2바이트 = 140GB라 H100 80GB가 2장 필요합니다. FP8로 줄이면 70GB라 한 장에 들어가지만, 요청마다 따로 필요한 메모리(${gl('[[KV 캐시]]')})를 둘 자리가 거의 남지 않습니다. 추론 서빙 단계에서 이어서 봅니다.`,set:{dt:'bf16',dtModel:70,dtMode:'infer'},go:hl('dtgpu')},
  {t:'학습은 파라미터당 16바이트',d:`학습에는 가중치 말고도 기울기, FP32 원본 가중치, Adam 옵티마이저 상태 2개가 필요합니다. ${gl('[[혼합 정밀도]]')}로 학습해도 파라미터당 약 16바이트입니다. 70B면 1.12TB, H100 14장 분량입니다. 계산 중간 결과(활성값)를 둘 자리는 따로 더 듭니다. 그래서 큰 모델 학습은 여러 GPU에 나눠 담습니다. 왼쪽에서 형식을 바꿔도 이 숫자는 거의 그대로입니다.`,set:{dt:'bf16',dtModel:70,dtMode:'train'},go:hl('dtgpu')}
];
SLIDES[24]=[
  {t:'데이터는 어디서 오나',d:`학습 데이터와 체크포인트는 보통 GPU 서버 밖의 공유 스토리지에 둡니다. 왼쪽이 스토리지 서버, 가운데가 계산망과 분리된 스토리지망 스위치, 오른쪽이 GPU 서버입니다. GPU 서버 안에도 빠른 로컬 NVMe가 있어 캐시로 씁니다.`,set:{stWork:'read',stMode:'normal',stFs:'pfs',stWorkers:4},go:hl()},
  {t:'보통의 길: CPU 메모리를 거친다',d:`일반적인 읽기는 스토리지에서 NIC를 지나 CPU 메모리에 먼저 내려놓고, 거기서 다시 GPU 메모리로 옮깁니다. 이렇게 잠시 거쳐 가는 CPU 메모리 자리를 바운스 버퍼라고 합니다. 복사가 한 번 더 있고, 그만큼 CPU와 메모리 대역폭을 씁니다. 빨간 선을 따라가 보세요.`,set:{stMode:'normal'},go:hl('stdram','stcpu')},
  {t:'GPUDirect Storage',d:`${gl('[[GPUDirect Storage]]')}를 쓰면 NIC나 NVMe가 GPU 메모리로 바로 데이터를 옮깁니다(DMA). CPU 메모리 복사가 없어서 CPU 부담과 지연이 줄어듭니다. 드라이버와 파일시스템이 지원해야 해서, 터미널에서 gdscheck로 확인합니다.`,set:{stMode:'gds'},go:hl('stnic','stgpu:0')},
  {t:'데이터 로더: GPU가 기다리지 않게',d:`이미지 디코딩, 자르기 같은 전처리는 CPU의 ${gl('[[데이터 로더]]')} 일꾼이 합니다. 일꾼이 없으면 GPU가 계산하고, 기다리고를 반복합니다. 왼쪽에서 일꾼 수를 0에서 4로 늘리거나, 터미널에서 python train.py --num_workers 4를 실행해 보세요. 상황판 숫자는 예시입니다.`,set:{stWork:'read',stMode:'normal',stWorkers:0},go:hl('stcore')},
  {t:'체크포인트: 중간 저장',d:`학습은 며칠씩 걸려서 중간 상태(${gl('[[체크포인트]]')})를 주기적으로 저장합니다. 70B면 가중치와 옵티마이저 상태로 약 1TB입니다. NAS 한 대로 저장하면 몇 분씩 걸리고, 그동안 GPU 수백 장이 멈춥니다.`,set:{stWork:'ckpt',stFs:'nfs',stModel:70},go:hl('nas')},
  {t:'병렬 파일시스템',d:`${gl('[[병렬 파일시스템]]')}은 파일을 여러 스토리지 서버에 나눠 담고 동시에 읽고 씁니다. 서버를 늘릴수록 대역폭이 커집니다. Lustre, IBM Storage Scale(GPFS), WekaFS, BeeGFS 등이 쓰입니다. 저장을 학습과 겹쳐 하는 비동기 저장도 함께 씁니다.`,set:{stWork:'ckpt',stFs:'pfs',stModel:70},go:hl('pfs:0','pfs:1','pfs:2','pfs:3')}
];
SLIDES[25]=[
  {t:'토큰 하나에 가중치 전체를 읽는다',d:`LLM은 답을 토큰(단어 조각) 하나씩 만듭니다. 토큰 하나를 만들 때마다 가중치 전체를 HBM에서 읽어야 합니다. 요청이 적으면 읽은 양에 비해 할 계산이 적어서, 계산 성능보다 메모리 대역폭이 속도를 정합니다. 13B FP16이면 매번 26GB를 읽습니다.`,set:{svModel:13,svW:'fp16',svKv:'fp16',svTp:1,svCtx:4096,svBatch:1},go:hl('svw')},
  {t:'KV 캐시: 앞 내용의 계산 결과',d:`앞 토큰들의 계산 결과(K, V)는 다시 계산하지 않도록 GPU 메모리에 둡니다. 이것이 ${gl('[[KV 캐시]]')}입니다. 크기는 모델의 층 수와 구조로 정해지고, 13B는 토큰 하나에 800KB입니다. 질문과 답을 합쳐 4,096토큰까지 쓰는 요청이면 하나에 약 3.4GB입니다. 색 칸 하나가 요청 하나입니다.`,set:{svBatch:8},go:hl('svkv')},
  {t:'메모리가 동시 요청 수를 정한다',d:`많이 쓰는 추론 서버인 vLLM은 시작할 때 GPU 메모리의 정해진 비율을 미리 잡습니다. 이 비율은 gpu_memory_utilization 설정으로 정하고, 기본값은 버전에 따라 0.9~0.92입니다. 여기서는 90%로 계산합니다. 잡은 메모리에서 가중치와 기타를 뺀 나머지가 KV 캐시 자리입니다. 13B면 약 43GB, 4,096토큰 요청이 12개쯤 들어갑니다. 요청 32개가 오면 나머지는 빨간 칸처럼 기다립니다.`,set:{svBatch:32},go:hl('svwait','svfree')},
  {t:'배치: 지연과 처리량',d:`요청을 묶으면 가중치를 한 번 읽어 여러 요청에 씁니다. 서버 전체 처리량은 크게 오르고, 요청 하나가 받는 속도는 조금 느려집니다. vLLM과 Triton(TensorRT-LLM)은 요청이 끝나는 대로 새 요청을 끼워 넣는 ${gl('[[연속 배치]]')}를 씁니다. 왼쪽에서 동시 요청을 1과 8로 바꿔 상황판 숫자를 비교해 보세요.`,set:{svBatch:8},go:hl('svreq')},
  {t:'큰 모델은 TP로 나눠 올린다',d:`70B는 FP16 가중치만 약 140GB라 한 장에 안 들어갑니다. TP 4면 GPU마다 약 35GB이고 남은 자리가 KV 캐시가 됩니다. TP는 층마다 GPU끼리 결과를 주고받아서 NVLink로 이어진 서버 한 대 안에서 씁니다. 왼쪽에서 TP를 2로 줄여 보고, KV 캐시 자리가 남는지 확인해 보세요.`,set:{svModel:70,svTp:4,svBatch:32},go:hl('svgpu')},
  {t:'FP8로 더 담기',d:`가중치나 KV 캐시를 FP8로 바꾸면 크기가 절반이 되어 같은 GPU에 더 많은 요청을 담습니다. 정확도가 조금 떨어질 수 있어서 서비스에 넣기 전에 평가합니다.`,set:{svModel:70,svTp:4,svW:'fp8',svKv:'fp8',svBatch:128},go:hl('svkv')},
  {t:'터미널에서 확인',d:`vllm serve로 서버를 띄우면 시작 로그에 KV 캐시에 담을 수 있는 토큰 수와 최대 동시 요청 수가 나옵니다. 터미널 버튼으로 실행해 보고, 옵션을 바꿔 다시 실행해 보세요.`,set:{svModel:13,svW:'fp16',svKv:'fp16',svTp:1,svCtx:4096,svBatch:32},go:hl()}
];
SLIDES[26]=[
  {t:'과제: 70B 모델을 학습하려면',d:`지금까지 배운 것을 모아 학습 클러스터를 어림해 봅니다. 순서는 메모리 → 복제본 하나 → 복제본 수 → 랙·전력 → 네트워크 → 기간입니다. 복제본은 모델 전체를 담는 GPU 묶음 하나를 말합니다. 숫자는 어림셈이고 가정은 아래 상황판에 적었습니다.`,set:{dsModel:70,dsDp:8,dsFocus:''},go:hl()},
  {t:'① 메모리부터',d:`혼합 정밀도 Adam 학습은 파라미터당 약 16바이트입니다. 70B면 1,120GB입니다. 80GB 가운데 20GB쯤은 계산 중간 결과(활성값) 몫으로 남기고 60GB까지 쓴다고 보면 GPU가 19장 이상 필요합니다.`,set:{dsFocus:'mem'},go:hl()},
  {t:'② 복제본 하나: TP × PP',d:`통신이 잦은 텐서 병렬은 서버 안 8장(NVLink)으로 하고, 모자란 만큼은 파이프라인 병렬로 서버를 이어 붙입니다. 19장이면 서버 3대로도 되지만, 층을 고르게 나누기 쉽도록 PP를 4로 올립니다. TP 8 × PP 4 = 32장, 서버 4대가 모델 하나를 담습니다. 같은 색 서버가 복제본 하나입니다.`,set:{dsFocus:'rep'},go:hl('dsrep')},
  {t:'③ 데이터 병렬로 속도 내기',d:`복제본을 8개 두면(DP 8) GPU 256장, 서버 32대입니다. 왼쪽에서 DP를 바꿔 보세요. 복제본 하나의 크기는 그대로이고, 전체 장수와 기간만 바뀝니다.`,set:{dsFocus:'dp'},go:hl('dssrv','dsrep')},
  {t:'④ 랙과 전력',d:`랙당 DGX H100 4대(약 41 kW)로 잡으면 서버 32대는 랙 8개, 서버만 최대 약 326 kW입니다. 랙 하나에 이만큼 넣으려면 시설이 받쳐 줘야 하고, 아니면 랙당 1~2대로 나눠 랙 수가 늘어납니다. 시설 단계에서 본 냉각 한계가 여기서 랙 수를 정합니다.`,set:{dsFocus:'rack'},go:hl('dsrack')},
  {t:'⑤ 네트워크',d:`GPU마다 400Gb/s NIC를 하나씩 달면 계산망 포트가 256개입니다. 64포트 스위치는 서버 쪽 32포트, 위쪽 32포트로 나눠 씁니다. 그러면 리프는 256 ÷ 32 = 8대, 리프 위쪽 포트 256개를 받는 스파인은 4대입니다. 어느 GPU끼리도 대역폭이 줄지 않는 2계층 구조가 됩니다. NVIDIA DGX SuperPOD도 서버 32대를 한 묶음(SU)으로 이렇게 짓습니다.`,set:{dsFocus:'net'},go:hl('dsleaf','dsspine')},
  {t:'⑥ 학습 기간',d:`학습 계산량은 약 6 × 파라미터 × 토큰입니다. 토큰 하나를 학습할 때 파라미터 하나마다 답 계산에 2번, 기울기 계산에 4번 연산해서 6입니다. 학습 데이터는 파라미터의 20배 토큰(1.4조)이 계산량에 비해 효율이 좋다고 알려져 있습니다. 이대로 잡으면 약 5.9 × 10²³ FLOP입니다. 실제 학습은 GPU 최고 성능의 30~50%만 계산에 씁니다. 이 비율을 ${gl('[[MFU]]')}라고 하고, H100 BF16 989 TFLOPS의 40%로 보면 GPU 256장으로 약 67일입니다. 모델과 DP를 바꿔 다시 계산해 보세요.`,set:{dsFocus:'time'},go:hl()}
];

{ const s0=SLIDES[14][0], base={...s0.set};

    if(![1,2,4,8].includes(tp)) return {out:`ValueError: tensor parallel size ${tp} — 이 서버의 GPU는 8장이다.\n# 1, 2, 4, 8 중에서 고른다.`,err:true};
    if(ctx>4096) return {out:`ValueError: User-specified max_model_len (${ctx}) is greater than the derived max_model_len (4096)\n# Llama 2는 최대 4,096토큰까지다.`,err:true};
    const o={svModel:mm,svTp:tp,svCtx:[1024,2048,4096].includes(ctx)?ctx:4096,svKv:/--kv-cache-dtype[ =]fp8/.test(opt)?'fp8':'fp16',svW:/--quantization[ =]fp8/.test(opt)?'fp8':'fp16'};
    v31Set(o); const r=sv(), head=`INFO Initializing an engine with config: model='meta-llama/${LM[mm].hf}', dtype=torch.float16, tensor_parallel_size=${tp}, max_model_len=${S.svCtx}, kv_cache_dtype=${S.svKv==='fp8'?'fp8':'auto'}\n`;

    if(r.nokv) return {out:head+`INFO Model loading took ${(r.wGB*1e9/2**30).toFixed(2)} GiB\nValueError: No available memory for the cache blocks. Try increasing \`gpu_memory_utilization\` when initializing the engine.\n# 가중치를 올리고 나니 KV 캐시 자리가 없다. TP를 늘린다.`,err:true,hl:['svw']};
    return {out:head+`INFO Model loading took ${(r.wGB*1e9/2**30).toFixed(2)} GiB\nINFO GPU KV cache size: ${fmtN(r.capTok)} tokens, Maximum concurrency for ${fmtN(S.svCtx)} tokens per request: ${r.conc.toFixed(2)}x\nINFO Starting vLLM API server on http://0.0.0.0:8000\n# (숫자는 이 페이지의 어림셈) KV 캐시 토큰 ÷ 최대 문맥 = 한꺼번에 받을 수 있는 최대 요청 수.`,hl:['svkv']}; }],

  'BF16':'16비트 실수 형식입니다. 지수가 FP32와 같은 8비트라 범위가 넓고, 정밀도는 낮습니다. 대형 모델 학습의 기본 형식입니다.','FP8':'8비트 실수 형식입니다. E4M3과 E5M2 두 가지가 있고, H100부터 텐서 코어가 지원합니다.','TF32':'텐서 코어가 FP32 행렬 곱을 할 때 가수를 10비트로 줄여 빠르게 계산하는 방식입니다.','혼합 정밀도':'계산은 BF16·FP16 같은 낮은 정밀도로, 원본 가중치와 누적은 FP32로 하는 학습 방법입니다.','양자화':'가중치나 활성값을 INT8, FP8처럼 더 적은 비트로 바꿔 메모리를 줄이고 빠르게 만드는 것입니다.',
  'GPUDirect Storage':'스토리지와 GPU 메모리 사이를 CPU 메모리를 거치지 않고 바로 옮기는 NVIDIA 기술입니다. cuFile API로 씁니다.','데이터 로더':'학습 데이터를 읽고 전처리해 배치로 만들어 GPU에 넘기는 부분입니다. PyTorch에서는 num_workers로 일꾼 프로세스 수를 정합니다.','체크포인트':'학습 중간 상태(가중치, 옵티마이저 상태)를 파일로 저장한 것입니다. 장애가 나면 여기서 다시 시작합니다.',
  'KV 캐시':'LLM이 앞 토큰들의 계산 결과(Key, Value)를 GPU 메모리에 저장해 두는 것입니다. 문맥이 길고 요청이 많을수록 커집니다.','연속 배치':'요청 묶음이 다 끝나길 기다리지 않고, 끝난 요청 자리에 새 요청을 바로 끼워 넣는 배치 방식입니다.','MFU':'Model FLOPs Utilization. GPU 최고 성능 가운데 모델 계산에 실제로 쓰인 비율입니다. 대형 학습에서 30~50% 정도가 흔합니다.'});

      checkIf('nccltimeout'); return {out:'Loading checkpoint from /mnt/shared/ckpt/step_1200 ...\n'+NORMAL_STEP+'\n# 마지막 체크포인트(1200스텝)에서 이어서 돈다.',hl:['dib']}; }
    return {out:NORMAL_STEP+'\n# 정상이다. 이 시나리오의 원인은 다른 곳에 있다.'}; }),

    return {out:'    PID STAT WCHAN                    CMD\n'+[...Array(8).keys()].map(l=>`  ${String(5120+l).padStart(5)} ${b&&l===0?'D   ':'Sl  '} ${(b&&l===0?'rpc_wait_bit_killable':'futex_wait_queue').padEnd(24)} python train.py --local-rank=${l}`).join('\n')+(b?'\n# local-rank 0(= rank 8)만 STAT이 D다. 디스크·NFS 같은 입출력을 기다리며 멈춘 상태라, kill로도 잘 안 죽는다.':'\n# 모두 정상(Sl)이다.'),hl:b?['dnodeb']:[]}; }),

  dgC(/^nsys profile .*python3? train\.py.*$/,'Nsight Systems로 기록',()=>{ DG.prof=true; if(S.dgSc==='nsys'&&DG.fixed) checkIf('nsys');

  dgC(/^nsys stats (?:--report|-r) (cuda_api_sum|cuda_gpu_mem_time_sum|cuda_gpu_kern_sum) step\.nsys-rep$/,'Nsight Systems 요약',m=>{ if(!DG.prof) return {out:'ERROR: step.nsys-rep: No such file or directory\n# 먼저 nsys profile로 기록한다.',err:true};
    const b=S.dgSc==='nsys'&&!(DG.pin&&DG.logok), r=m[1]; if(b&&r!=='cuda_gpu_kern_sum') DG.found=true;
    if(r==='cuda_api_sum') return {out:` ** CUDA API Summary (cuda_api_sum):\n\n Time (%)  Total Time (ns)  Num Calls  Name\n --------  ---------------  ---------  ----------------------\n${b?'     58.4    9,412,330,112      1,000  cudaStreamSynchronize\n     27.9    4,497,102,544      2,000  cudaMemcpyAsync\n      9.1    1,466,511,203     84,000  cudaLaunchKernel':'     71.6    1,466,511,203     84,000  cudaLaunchKernel\n     18.2      372,810,550      2,000  cudaMemcpyAsync\n      1.2       24,577,106         10  cudaStreamSynchronize'}\n# (예시, 일부 열) ${b?'cudaStreamSynchronize가 스텝 수(1,000)만큼 불렸다 = 매 스텝 CPU가 GPU를 기다린다. loss.item(), print(loss) 같은 줄을 찾는다.':'동기화가 10번으로 줄었다.'}`};
    if(r==='cuda_gpu_mem_time_sum') return {out:` ** CUDA GPU MemOps Summary (by Time) (cuda_gpu_mem_time_sum):\n\n Time (%)  Total Time (ns)  Count  Operation\n --------  ---------------  -----  ----------------------------\n     99.2    ${b?'1,284,400,112':'  642,310,551'}  2,000  [CUDA memcpy Host-to-Device]\n      0.8       10,250,331     10  [CUDA memcpy Device-to-Host]\n# (예시) ${b?'고정(pinned)이 아닌 메모리에서 복사하면 고정 메모리로 한 번 옮겨 담는 동안 CPU가 묶이고, 복사가 계산과 겹치지 못한다. DataLoader(pin_memory=True)와 .to(..., non_blocking=True)를 함께 쓴다.':'고정 메모리라 복사가 빨라지고 계산과 겹쳐 돈다.'}`};
    return {out:' ** CUDA GPU Kernel Summary (cuda_gpu_kern_sum):\n\n Time (%)  Total Time (ns)  Instances  Name\n --------  ---------------  ---------  --------------------------------\n     41.2    3,210,445,120     24,000  sm90_xmma_gemm_bf16bf16_bf16f32...\n     18.7    1,457,220,031     12,000  flash_fwd_kernel...\n# 커널 자체는 정상이다. 커널 사이 빈 시간이 문제인지는 cuda_api_sum과 타임라인으로 본다.'}; }),
  dgC(/^python3? train\.py( .*)?$/,'학습 코드 실행',m=>{ const a=m[1]||''; if(S.dgSc==='nsys'){ DG.pin=DG.pin||/--pin[_-]memory/.test(a); const lg=a.match(/--log[_-]every[ =](\d+)/); if(lg&&+lg[1]>=10) DG.logok=true;
      if(DG.pin&&DG.logok&&!DG.fixed){ DG.found=true; DG.fixed=true; } }
    const good=S.dgSc!=='nsys'||(DG.pin&&DG.logok), half=DG.pin||DG.logok, ms=good?410:half?650:790;
    return {out:`step 100 | ${ms} ms/step\nstep 200 | ${ms+1} ms/step\n# ${good?'정상 속도다.'+(S.dgSc==='nsys'?' nsys profile로 다시 기록해 타임라인을 확인한다.':''):half?'나아졌지만 아직 느리다. 고칠 곳이 하나 더 있다.':'느리다. 원인을 찾으려면 nsys profile로 기록한다.'}`}; })

STEPS.push({ part:'3부', title:'느리거나 멈출 때 진단', scene:'diag', dom:['A3','P'], badges:[A3,P3], cam:null,
  goals:['오류 없이 느린 장애를 클록·전력·PCIe·NVLink·InfiniBand 순서로 좁힐 수 있습니다','NCCL 로그와 타임아웃 메시지에서 원인 노드를 찾을 수 있습니다','Nsight Systems로 GPU가 노는 시간과 그 이유를 볼 수 있습니다'],
  key:['오류가 없으면 GPU마다 클록·전력·링크를 나란히 놓고 혼자 다른 한 장을 찾습니다. 한 장만 느려도 동기화 때문에 전체가 그 속도로 갑니다.','링크는 끊기기 전에 오류 카운터가 먼저 늘어납니다. NVLink는 nvidia-smi nvlink -e, InfiniBand는 perfquery로 봅니다.','NCCL 타임아웃은 기다린 쪽이 남깁니다. 메시지가 없는 rank와 NCCL이 고른 네트워크부터 봅니다.'],
  body:()=>`<div class="sec prose"><h3>해 보기</h3><p>왼쪽에서 시나리오를 고르고 터미널로 원인을 찾아 고쳐 보세요. 원인을 찾으면 3D에 위치가 빨갛게 나타나고, 고치면 초록이 됩니다. 막히면 '원인 미리 보기'를 켭니다. 위쪽 '증상' 버튼은 증상별로 먼저 볼 명령을 모아 둔 곳입니다.</p></div>
   <div class="sec"><h3>증상별로 먼저 볼 명령</h3><div class="tbl"><table class="t"><thead><tr><th>증상</th><th>먼저 볼 것</th></tr></thead><tbody>
    <tr><td>오류 없이 느리다</td><td><code>nvidia-smi --query-gpu=index,clocks.sm,power.draw,power.limit,temperature.gpu --format=csv</code>, <code>nvidia-smi -q -d PERFORMANCE</code></td></tr>
    <tr><td>CPU↔GPU 복사가 느리다</td><td><code>pcie.link.width.current</code>와 <code>max</code> 비교, <code>sudo lspci -vv</code>의 LnkSta</td></tr>
    <tr><td>서버 안 all-reduce가 들쭉날쭉</td><td><code>nvidia-smi nvlink -e</code>, nccl-tests</td></tr>
    <tr><td>여러 서버일 때만 느리다</td><td><code>NCCL_DEBUG=INFO</code>, <code>sudo perfquery</code></td></tr>
    <tr><td>멈췄다가 타임아웃</td><td>메시지가 없는 rank, 그 노드의 <code>ps</code> STAT와 dmesg</td></tr>
    <tr><td>사용률이 오르내린다</td><td><code>nsys profile</code> → <code>nsys stats</code></td></tr></tbody></table></div></div>
   <div class="sec"><h3>감시에 걸어 둘 것</h3><ul class="ilist">
    <li><b>클록이 떨어진 이유</b> DCGM의 DCGM_FI_DEV_CLOCKS_EVENT_REASONS(예전 이름 CLOCK_THROTTLE_REASONS)와 전력 제한 값을 수집해, 한 장만 다르면 알림을 줍니다.</li>
    <li><b>NVLink 오류</b> CRC·Replay 오류 카운터(DCGM 필드 이름은 버전에 따라 다릅니다)가 늘어나는 속도로 알림을 겁니다. 값 자체보다 증가가 중요합니다.</li>
    <li><b>InfiniBand</b> 포트 카운터(SymbolError, LinkDowned)를 주기적으로 모아 늘어나는 포트를 찾습니다.</li>
    <li><b>PCIe</b> 링크 폭(DCGM_FI_DEV_PCIE_LINK_WIDTH)을 모아 최대값보다 작은 GPU를 찾습니다. 투입 전과 재부팅 뒤에도 한 번씩 확인합니다.</li></ul></div>`,
  live:()=>dgLive(), compare:[],
  quiz:{q:'두 서버 학습이 NCCL 타임아웃으로 죽었습니다. 16개 rank 가운데 15개만 타임아웃 메시지를 남겼습니다. 먼저 볼 곳은?',opts:['메시지를 남기지 않은 rank의 프로세스','타임아웃 메시지가 가장 먼저 찍힌 rank','InfiniBand 스위치 설정'],a:0,ex:'타임아웃 메시지는 집합 통신에서 기다리던 rank들이 남깁니다. 집합 통신에 들어오지 못하고 다른 곳에서 멈춘 rank가 원인일 가능성이 커서, 메시지가 없는 rank부터 봅니다.'} });

  key:['GPU가 많을수록 어딘가 고장 날 확률이 커서, 클러스터 고장 간격(MTBF)은 GPU 수에 반비례해 짧아집니다.','체크포인트를 자주 하면 저장에, 드물게 하면 고장 때 잃는 작업에 시간을 씁니다. 균형점은 약 √(2 × 저장 시간 × MTBF)입니다.','저장을 빠르게, 재시작을 빠르게, 고장 날 노드를 미리 빼는 것이 실제 학습 시간을 늘립니다.'],
  body:()=>`<div class="sec prose"><h3>해 보기</h3><p>왼쪽에서 GPU 수, 저장 시간, 재시작 시간, 저장 간격을 바꿔 보세요. 3D는 하루 24시간을 한 줄로 펼친 것이고, 빨간 막대가 고장으로 잃은 학습입니다.</p></div>
   <div class="sec"><h3>실제 기록: Llama 3 405B</h3><p class="note" style="margin-top:0">H100 최대 16,384장으로 학습하는 동안 54일 사이에 예기치 않은 중단이 419번 있었습니다. 하루 약 8번, 3시간에 한 번 꼴입니다. 원인의 약 78%가 하드웨어 문제(확인 또는 추정)였고, GPU 관련이 58.7%로 가장 많았습니다(GPU 고장, HBM3 메모리 등). 그런데도 자동화 덕분에 실제 학습 시간 비율은 90%를 넘었습니다.</p></div>
   <div class="sec"><h3>실제 학습 시간을 늘리는 방법</h3><ul class="ilist">
    <li><b>저장 빠르게</b> 병렬 파일시스템, 비동기 저장, 로컬 NVMe에 먼저 쓰기 (스토리지 단계)</li>
    <li><b>재시작 빠르게</b> 자동 재시작, 미리 점검한 예비 노드, 체크포인트 빠른 로딩</li>
    <li><b>고장 전에 빼기</b> 작업 전 짧은 건강 검사(dcgmi diag -r 1, 짧은 nccl-tests), Xid·ECC·링크 오류 추세로 미리 drain, 느린 노드(straggler) 찾기</li></ul></div>`,
  live:()=>flLive(), compare:[],
  quiz:{q:'다른 조건은 같고 GPU 수만 4배로 늘렸습니다. 클러스터 고장 간격(MTBF)은?',opts:['약 1/4로 짧아진다','그대로다','약 4배 길어진다'],a:0,ex:'GPU마다 고장이 독립적으로 난다고 보면, 장수가 4배면 하루 고장 횟수도 4배라 고장 간격은 1/4이 됩니다. 그래서 큰 클러스터일수록 저장과 재시작을 빠르게 만드는 것이 중요합니다.'} }
);

SLIDES[28]=[
  {t:'느린 학습을 몫으로 쪼갠다',d:`학습 한 스텝은 데이터를 기다리는 시간, CPU가 커널을 실행 준비하는 시간, GPU 계산, 계산과 겹치지 못한 통신으로 나뉩니다. 3D의 막대가 GPU마다 한 스텝이고, 지금은 아무 튜닝도 안 한 상태입니다. 숫자는 이해를 돕는 예시입니다.`,set:{tnLoader:false,tnNuma:false,tnBf16:false,tnOverlap:false,tnGraph:false},go:hl()},
  {t:'가장 큰 몫부터',d:`지금은 계산 다음으로 데이터 기다림이 큽니다. 로더 일꾼을 늘리고 고정 메모리(pin_memory)를 쓰면 다음 배치가 미리 준비되어 기다림이 거의 사라집니다.`,set:{tnLoader:true,tnNuma:false,tnBf16:false,tnOverlap:false,tnGraph:false},go:hl('tndata')},
  {t:'로더를 GPU 쪽 CPU에 붙인다',d:`로더 프로세스가 반대편 CPU에서 돌면 메모리를 소켓 너머로 가져옵니다. GPU와 같은 NUMA 노드에 붙이면(numactl 등) 데이터 준비와 실행 준비가 조금 더 빨라집니다. 1부 NUMA 단계와 같은 이야기입니다.`,set:{tnNuma:true},go:hl('tndata','tnlaunch')},
  {t:'혼합 정밀도로 텐서 코어를 쓴다',d:`FP32로 계산하던 것을 BF16 혼합 정밀도로 바꾸면 행렬 곱이 텐서 코어로 가서 계산 몫이 절반 아래로 줄어듭니다. 원본 가중치는 FP32로 두어 정확도를 지킵니다.`,set:{tnBf16:true},go:hl('tncompute')},
  {t:'통신을 계산 뒤에 숨긴다',d:`데이터 병렬(DDP)은 역전파가 끝난 기울기 묶음(bucket)부터 all-reduce를 시작해서 통신을 계산과 겹칩니다. 다 겹치지 못한 부분만 스텝 시간에 드러납니다. 이 몫이 크면 NVLink·InfiniBand 경로부터 확인합니다.`,set:{tnOverlap:true},go:hl('tncomm')},
  {t:'실행 준비를 줄인다',d:`작은 커널이 아주 많으면 CPU가 커널을 하나씩 실행하는 준비 시간이 쌓입니다. CUDA Graphs는 커널 묶음을 한 번에 실행하고, torch.compile은 커널을 합쳐서 그 시간을 줄입니다.`,set:{tnGraph:true},go:hl('tnlaunch')},
  {t:'한 번에 하나씩, 다시 잰다',d:`처음 860ms가 약 260ms로 줄었습니다(예시). 실제로는 한 번에 하나만 바꾸고 다시 재야 무엇이 효과였는지 압니다. GPU 한 장이나 서버 한 대만 느리면 튜닝보다 앞 단계의 진단이 먼저입니다.`,set:{tnLoader:true,tnNuma:true,tnBf16:true,tnOverlap:true,tnGraph:true},go:hl()}

    $('#sidebody').style.maxHeight=`calc(100vh - ${top+70}px)`;
    const sl=side.getBoundingClientRect().right+12, srR=open?pr0.left-12:innerWidth-12, sw=Math.min(700,srR-sl);
    story.style.top=(top+12)+'px'; story.style.left=(sl+(srR-sl-sw)/2)+'px'; story.style.width=sw+'px'; story.style.right='';
    const hR=pr0.left-12, hw=Math.min(hud.classList.contains('min')?360:hud.classList.contains('withterm')?760:620,hR-sl);
    hud.style.left=(sl+(hR-sl-hw)/2)+'px'; hud.style.width=hw+'px'; hud.style.right=''; hud.style.bottom=''; hud.style.maxHeight='';
  } else {
    story.style.top=(top+8)+'px'; story.style.left=''; story.style.width=''; story.style.right='';
    side.style.top=(story.getBoundingClientRect().bottom+8)+'px';
    $('#sidebody').style.maxHeight='';
    hud.style.left=''; hud.style.width=''; hud.style.right=''; hud.style.bottom=(innerHeight-pr0.top+8)+'px';
    /* 펼쳐도 왼쪽 설정 줄을 덮지 않고 3D가 최소 140px 보이게 */
    const sb=Math.max(side.getBoundingClientRect().bottom,story.getBoundingClientRect().bottom); hud.style.maxHeight=hud.classList.contains('min')?'':Math.max(160,pr0.top-16-sb-140)+'px';
  }
  if(!renderer) return;
  const w=view.clientWidth,h=view.clientHeight;
  renderer.setSize(w,h); labelR.setSize(w,h); camera.aspect=w/h; fatMats.forEach(m=>m.resolution.set(w,h));
  const fr=side.getBoundingClientRect(), sr=story.getBoundingClientRect(), pr=panel.getBoundingClientRect(), hr=hud.hidden?null:hud.getBoundingClientRect();
  const leftX=wide?fr.right:0, rightX=wide&&open?pr.left:w;
  const topY=wide?sr.bottom:Math.max(sr.bottom,fr.bottom), botY=Math.min(hr?hr.top:h,wide?h:pr.top);
  VIS={w:Math.max(80,rightX-leftX),h:Math.max(80,botY-topY),W:w,H:h};
  camera.setViewOffset(w,h,w/2-(leftX+rightX)/2,h/2-(topY+botY)/2,w,h); camera.updateProjectionMatrix();
}

if(renderer){
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const pick=ev=>{
    const r=renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    const h=ray.intersectObjects(pickables,false).find(x=>x.object.visible&&x.object.userData.key!=='case');
    return h?h.object.userData.key:null;
  };
  let down=null;
  renderer.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>5) return;
    const k=pick(e);
    if(!k||k===S.part){ if(S.part) clearPart(); return; }
    const t=typeOf(k);
    if(t==='pick'){ storyGo(k==='pick:card'?1:4,true); return; }
    S.part=k;
    if(TOPO(S.step)&&(t==='gpu'||t==='sxm')){ const i=+k.split(':')[1]; if(S.sel.length!==1) S.sel=[i]; else if(S.sel[0]!==i) S.sel=[S.sel[0],i]; update3D(); renderLeft(); }
    if(S.step===1) renderLeft();
    refreshGlow(); renderLive();
    if(hudMin){ hudMin=false; hudUser=true; applyHud(); fit(); }
    if(S.step!==1&&!TOPO(S.step)){ const hud=$('#hud'), pi=partInfo(); if(pi){ if(hudMin){ hudMin=false; hudUser=true; applyHud(); } hud.hidden=false; $('#hudlive').hidden=false; $('#hudlive').insertAdjacentHTML('beforeend',`<div style="margin-top:12px">${pi}</div>`); } }
  });
  let hp=false;
  renderer.domElement.addEventListener('pointermove',e=>{
    if(hp||e.buttons) return; hp=true;
    requestAnimationFrame(()=>{ hp=false; const k=pick(e); if(k!==hoverKey){ hoverKey=k; renderer.domElement.style.cursor=k?'pointer':dragMode==='pan'?'move':'grab'; refreshGlow(); } });
  });
  renderer.domElement.addEventListener('pointerleave',()=>{ if(hoverKey){ hoverKey=null; refreshGlow(); } });
  new ResizeObserver(fit).observe(view);
  new ResizeObserver(fit).observe($('#topbar'));
  new ResizeObserver(fit).observe($('#side'));
  new ResizeObserver(fit).observe($('#story'));
  new ResizeObserver(fit).observe($('#hud'));
  new ResizeObserver(fit).observe($('#panel'));
  const applyTheme=()=>{ if(world) update3D(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  let last=performance.now();
  const loop=function(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(anim){ const k=Math.min(1,(now-anim.t0)/700), e=1-Math.pow(1-k,3); camera.position.lerpVectors(anim.fp,anim.tp,e); controls.target.lerpVectors(anim.ft,anim.tt,e); if(k===1) anim=null; }
    controls.update();
    if(lidPivot){ lidPivot.rotation.x=0; lidPivot.visible=!S.lid; }
    computeTick(now); animExtras(now,dt);
    if(!reduce){
      fans.forEach(f=>{ if(f.userData.axis==='z') f.rotation.z+=dt*7; else f.rotation.x+=dt*5; });
      paths.forEach(p=>{ const u=now/1000*(2+p.speed*16)/p.len; p.packets.forEach(s=>s.position.copy(p.curve.getPointAt((u+s.userData.off)%1))); });
    }
    renderer.render(scene,camera); labelR.render(scene,camera); declutter(now);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

/* 완료는 확인 문제를 맞힌 단계만. 예전 규칙(끝까지 보면 완료)으로 저장된 표시는 여기서 정리한다 */
STEPS.forEach((st,i)=>{ if(st.quiz&&S.done[i]&&S.quiz[i]!==st.quiz.a) delete S.done[i]; });
goStep(S.step,true);
})();
</script>
