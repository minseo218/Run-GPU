<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPU 서버 해부도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 화면 전체 3D. 위 = 반투명 내비게이션 막대(단계), 왼쪽 = 설정 목록, 오른쪽 = 수업 시트. 시스템 글꼴과 반투명 유리 패널 */
:root{
  --bg:#f5f5f7; --scene:#e6e8eb; --scene-hi:#ffffff; --card:#ffffff; --glass:rgba(242,242,247,.84); --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12);
  --accent:#0071e3; --nv:#0b8a7a; --pcie:#c25e00; --sys:#d70015; --mig:#8944ab; --ok:#248a3d; --bad:#d70015; --glow:#0071e3; --switch:#34c759;
  --tagbg:rgba(255,255,255,.94); --shade:rgba(0,0,0,.28); --codebg:#1d1d1f; --codefg:#f5f5f7;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --scene:#0b0b0d; --scene-hi:#2a2b30; --card:#2c2c2e; --glass:rgba(22,22,24,.8); --ink:#f5f5f7; --muted:#98989d; --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
  --accent:#2997ff; --nv:#40c8b4; --pcie:#ff9f0a; --sys:#ff453a; --mig:#bf5af2; --ok:#30d158; --bad:#ff453a; --glow:#2997ff; --switch:#30d158;
  --tagbg:rgba(28,28,30,.92); --shade:rgba(0,0,0,.6); --codebg:#2c2c2e; --codefg:#f5f5f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --scene:#0b0b0d; --scene-hi:#2a2b30; --card:#2c2c2e; --glass:rgba(22,22,24,.8); --ink:#f5f5f7; --muted:#98989d; --line:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
  --accent:#2997ff; --nv:#40c8b4; --pcie:#ff9f0a; --sys:#ff453a; --mig:#bf5af2; --ok:#30d158; --bad:#ff453a; --glow:#2997ff; --switch:#30d158;
  --tagbg:rgba(28,28,30,.92); --shade:rgba(0,0,0,.6); --codebg:#2c2c2e; --codefg:#f5f5f7; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);letter-spacing:-.01em;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;letter-spacing:inherit}
#view{position:fixed;inset:0;background:radial-gradient(130% 95% at 50% 30%,var(--scene-hi),var(--scene) 72%)}
#view canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{font:500 12px/1 var(--sans);padding:6px 10px;border-radius:999px;background:var(--tagbg);color:var(--ink);white-space:nowrap;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:opacity .25s}
.tag.gpu{font-weight:600}
.tag.sel{background:var(--accent);color:#fff}
.tag.mig{color:var(--mig)}
.tag.big{font-size:13px;padding:7px 12px}
.tag.mmtag{color:#fff;font-weight:600}

.fl{box-sizing:border-box;position:fixed;z-index:4;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:20px;box-shadow:0 0 0 .5px var(--line),0 8px 30px rgba(0,0,0,.08)}
.topbar{z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;padding:10px 12px 10px 18px;border-radius:18px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap}
.spacer{flex:1}
.tbtn{font-size:13px;font-weight:500;color:var(--ink);background:var(--fill);border:0;border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{filter:brightness(.97)}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.primary{background:var(--accent);color:#fff}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:2px;flex:none}
.seg button{font-size:13px;font-weight:500;border:0;background:none;color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.steps-bar{display:flex;align-items:center;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none;padding:2px;background:var(--fill);border-radius:999px}
.steps-bar::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;white-space:nowrap}
.pill .n{font-size:11px;font-weight:600;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pill.done .n{background:var(--ok);color:#fff}
.pill[aria-current="step"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pill[aria-current="step"] .n{background:var(--accent);color:#fff}
.pill:disabled{cursor:default;opacity:.45}
.partsep{flex:none;font-size:12px;font-weight:600;color:var(--muted);padding:0 4px 0 10px;white-space:nowrap}

.side{left:max(12px,env(safe-area-inset-left,0px));width:260px;overflow:hidden;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 4px}
.phead span{font-size:13px;font-weight:600;color:var(--muted)}
.sidebody{display:flex;flex-direction:column;gap:18px;padding:8px 12px 14px;overflow:auto}
.grp{display:flex;flex-direction:column}
.grp>.gl{font-size:12px;font-weight:500;color:var(--muted);padding:0 6px 6px}
.grp>.opt{background:var(--card);border-radius:0}
.grp>.gl+.opt,.grp>.opt:first-child{border-top-left-radius:12px;border-top-right-radius:12px}
.grp>.opt:last-child{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.grp>.opt+.opt{box-shadow:inset 0 .5px 0 var(--line)}
.opt{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.opt .ft{display:flex;flex-direction:column;gap:1px;line-height:1.3;min-width:0}
.opt b{font-weight:500}
.opt small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt i{display:block;height:3px;border-radius:2px;margin-top:5px;opacity:.85}
.opt input{appearance:none;-webkit-appearance:none;margin:0;flex:none;cursor:pointer}
.opt input[type=radio]{width:18px;height:18px;display:grid;place-items:center}
.opt input[type=radio]:checked::after{content:"";width:10px;height:5px;border:2.5px solid var(--accent);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.opt input[type=checkbox]{position:relative;width:44px;height:26px;border-radius:999px;background:var(--fill);transition:background .2s}
.opt input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.opt input[type=checkbox]:checked{background:var(--switch)}
.opt input[type=checkbox]:checked::after{transform:translateX(18px)}
.opt:has(input:disabled){opacity:.4;cursor:default}
.k-nv b,.k-pcie b,.k-sys b,.k-mig b{font-family:var(--mono);font-weight:600;font-size:13px}
.k-nv b{color:var(--nv)} .k-pcie b{color:var(--pcie)} .k-sys b{color:var(--sys)} .k-mig b{color:var(--mig)}
.opt.m input[type=checkbox]:checked{background:var(--mig)}
.optrow{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:10px}
.optrow .opt{flex:1 1 0;justify-content:center;padding:6px 4px;border-radius:8px;font-size:13px;background:none}
.optrow .opt input{display:none}
.optrow .opt:has(input:checked){background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.optrow .opt b{font-weight:600}
.range{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:var(--card);border-radius:0 0 12px 12px;box-shadow:inset 0 .5px 0 var(--line);font-size:14px}
.range input{width:100%;accent-color:var(--accent)}
.actbtn{font-size:15px;font-weight:500;padding:11px 14px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.actbtn.ghost{background:var(--card);color:var(--accent);margin-top:8px}
.linkbtn{font-size:14px;font-weight:400;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.legend{display:flex;flex-direction:column;gap:7px;padding:10px 14px;background:var(--card);border-radius:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:10px;line-height:1.35}
.legend i{flex:none;width:22px;height:4px;border-radius:2px}
.legend i.thick{height:8px;border-radius:4px}
.legend i.plate{width:6px;height:16px;border-radius:2px}

.panel{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:clamp(340px,30vw,420px);display:flex;flex-direction:column;overflow:hidden}
.panel .phead{padding:14px 20px 0}
.panel.collapsed .pbody{display:none}
.panel.collapsed{width:auto}
.panel.collapsed .phead{padding-bottom:12px}
.pbody{overflow:auto;padding:2px 20px 22px}
.lesson h2{margin:2px 0 0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:10px 0 0;font-size:16px;line-height:1.55;color:var(--muted)}
.cert{margin:12px 0 0;font-size:12px;color:var(--muted)}
.cert .done{color:var(--ok);font-weight:600}
.disc{margin-top:14px;background:var(--card);border-radius:14px;padding:0 16px}
.disc summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:500;color:var(--accent);list-style:none}
.disc summary::-webkit-details-marker{display:none}
.disc ul{margin:0;padding:0 0 12px 18px;font-size:14px}
.disc li+li{margin-top:4px}
.sec{margin-top:26px}
.sec h3{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:-.015em}
.prose p{margin:0 0 10px;font-size:15px;line-height:1.6}
.prose p:last-child{margin-bottom:0}
.adv{background:var(--card);border-radius:16px;padding:16px;font-size:14px;line-height:1.6}
.adv>b:first-child{display:block;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px}
.adv>b:first-child+br{display:none}
pre.cmd{margin:10px 0 0;padding:12px 14px;background:var(--codebg);color:var(--codefg);border-radius:12px;font:500 12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}
.tbl{overflow-x:auto;background:var(--card);border-radius:14px;padding:4px 12px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:9px 6px;text-align:left;vertical-align:top}
table.t tbody tr+tr td,table.t tbody tr td{box-shadow:inset 0 .5px 0 var(--line)}
table.t thead th{color:var(--muted);font-weight:500;font-size:12px}
table.t td:first-child{color:var(--muted)}
table.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);text-underline-offset:3px;cursor:help}
.readout{display:grid;gap:8px;padding:18px;border-radius:18px;background:var(--card)}
.readout .big{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.readout .sub{font-size:13px;color:var(--muted);line-height:1.5}
.hbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.bars{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:52px 1fr 108px;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.bars li.cur{color:var(--ink);font-weight:600}
.bars code{font:600 12px var(--mono)}
.bars .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pathhead{display:flex;align-items:center;gap:14px}
.code{font:700 22px var(--mono);padding:8px 12px;border-radius:12px;min-width:68px;text-align:center}
.k-nv.code{background:color-mix(in srgb,var(--nv) 14%,transparent);color:var(--nv)}
.k-pcie.code{background:color-mix(in srgb,var(--pcie) 14%,transparent);color:var(--pcie)}
.k-sys.code{background:color-mix(in srgb,var(--sys) 12%,transparent);color:var(--sys)}
.k-mig.code{background:var(--fill);color:var(--mig)}
.pathhead strong{display:block;font-size:17px;font-weight:600}
.p2p{font-size:13px}
.p2p.ok{color:var(--ok)} .p2p.no{color:var(--bad)}
.stepsline{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 0;font-size:13px;color:var(--muted)}
.stepsline li{display:flex;align-items:center}
.stepsline li+li::before{content:"›";margin:0 7px;color:var(--muted)}
.mxwrap{overflow-x:auto;background:var(--card);border-radius:14px;padding:8px}
.mx{border-collapse:separate;border-spacing:3px;font-size:11px}
.mx th{font-weight:500;color:var(--muted);padding:0 3px;white-space:nowrap}
.mx thead th{vertical-align:bottom}
.migb{display:block;font-size:10px;color:var(--mig)}
.mx td.diag{text-align:center;color:var(--muted)}
.cell{position:relative;font:600 11px var(--mono);width:42px;height:30px;border-radius:8px;border:0;cursor:pointer;color:var(--ink);background:var(--fill)}
.cell.k-nv{background:color-mix(in srgb,var(--nv) 16%,transparent);color:var(--nv)}
.cell.k-pcie{background:color-mix(in srgb,var(--pcie) 14%,transparent);color:var(--pcie)}
.cell.k-sys{background:color-mix(in srgb,var(--sys) 12%,transparent);color:var(--sys)}
.cell.k-mig{background:var(--fill);color:var(--muted);font-weight:500}
.cell.nop2p::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--sys)}
.cell.on{box-shadow:0 0 0 2px var(--accent)}
.note{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.nest{display:grid;place-items:stretch}
.nest div{background:var(--fill);border-radius:18px;padding:12px 14px 14px;font-size:13px;color:var(--muted);text-align:center}
.nest div div{margin-top:10px;background:var(--card)}
.nest div div div{background:var(--fill)}
.nest b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.quiz p.q{margin:0 0 12px;font-size:16px;font-weight:600;line-height:1.45}
.qopts{display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font-size:15px;color:var(--ink);background:none;border:0;padding:13px 16px;cursor:pointer}
.qopt+.qopt{box-shadow:inset 0 .5px 0 var(--line)}
.qopt:hover{background:var(--fill)}
.qopt.right{color:var(--ok);font-weight:600}
.qopt.right::after{content:"정답";font-size:12px}
.qopt.wrong{color:var(--bad)}
.qopt.wrong::after{content:"내 답";font-size:12px}
.qres{margin:12px 0 0;font-size:14px;line-height:1.55;color:var(--muted)}
.qres b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:28px}
.navrow .tbtn{padding:10px 18px;font-size:15px}
.info dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.info dt{color:var(--muted)} .info dd{margin:0}
.info h4{margin:0;font-size:17px;font-weight:600}
.infoh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.infox{font-size:14px;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer}
.info{background:var(--card);border-radius:16px;padding:16px}
.compare-link{margin-top:14px}
.story{z-index:4;padding:14px 18px 12px;display:flex;flex-direction:column;gap:6px}
.st-top{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:flex;align-items:center;gap:5px}
.dots button{width:7px;height:7px;border-radius:4px;border:0;padding:0;background:var(--fill);cursor:pointer;transition:width .25s}
.dots button.on{background:var(--ink);width:20px}
.st-auto{display:flex;align-items:center;gap:7px;cursor:pointer}
.st-auto input{appearance:none;-webkit-appearance:none;position:relative;margin:0;width:34px;height:20px;border-radius:999px;background:var(--fill);cursor:pointer;transition:background .2s}
.st-auto input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.st-auto input:checked{background:var(--switch)}
.st-auto input:checked::after{transform:translateX(14px)}
.st-body h3{margin:2px 0 0;font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.st-body>p{margin:6px 0 0;font-size:15px;line-height:1.6;color:color-mix(in srgb,var(--ink) 78%,transparent)}
.st-body>p b{color:var(--ink)}
.st-body .quiz{margin-top:10px}
.st-body .linkbtn{margin-top:8px}
@media (prefers-reduced-motion: no-preference){
  @keyframes stIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .st-body.enter{animation:stIn .38s cubic-bezier(.2,.8,.2,1)}
}
.st-nav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mini{margin-top:12px;background:var(--card);border-radius:12px;padding:2px 12px}
.picks{display:flex;gap:8px;margin-top:12px}
.picks .actbtn{flex:1}
.hud{z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:14px 16px;max-height:38vh;overflow:auto}
.hud .readout,.hud .info{padding:0;background:none}
.hud{padding-top:36px}
.hudbar{position:absolute;top:10px;left:16px;right:12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);pointer-events:none}
.hudbar button{pointer-events:auto;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 4px}
.hud.min{padding-top:34px;padding-bottom:4px;max-height:none;overflow:hidden}
.hud.min.withterm{display:block}
.hud.min>#hudterm,.hud.min>#hudlive{display:none!important}
.hud .sec{margin-top:16px}
.hud .sec h3{font-size:15px;margin-bottom:6px}
.hud.withterm{display:block;max-height:50vh;overflow:auto}
.hud.tab-live>#hudterm,.hud.tab-term>#hudlive{display:none!important}
.hudtabs{display:inline-flex;gap:2px;background:var(--fill);border-radius:999px;padding:2px;pointer-events:auto;margin-top:-4px}
.hudtabs button{font-size:12px;font-weight:500;border:0;background:none;color:var(--muted);padding:3px 12px;border-radius:999px;cursor:pointer}
.hudtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.side.min .sidebody{display:none}
.side.min{width:auto}
.side.min .phead{padding-bottom:12px}
.readnote{margin:6px 20px 0;font-size:12px;color:var(--muted);line-height:1.45}
.side .phead .linkbtn,.st-min{font-size:12px}
.story.min .st-body>p,.story.min .st-body .quiz,.story.min .st-body .mini,.story.min .st-body .picks,.story.min .st-body pre,.story.min .st-body>.linkbtn,.story.min .st-body .qres{display:none}
.help{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--card);border-radius:14px;padding:12px 14px}
.hrow>b{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.hrow h4{margin:0 0 2px;font-size:15px;font-weight:600}
.hrow p{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.myth{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.myth li{background:var(--card);border-radius:14px;padding:12px 14px}
.myth .x{display:block;font-size:14px;color:var(--bad);font-weight:500}
.myth .x::before{content:"오해 · ";color:var(--muted);font-weight:400}
.myth .o{display:block;margin-top:4px;font-size:14px;line-height:1.55}
.refs{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.refs a{color:var(--accent);text-decoration:none;word-break:break-word}
.refs a:hover{text-decoration:underline}
.pill:hover{color:var(--ink)}
.tbtn:focus-visible,.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hudterm,#hudlive{min-width:0}
.hud.withterm #hudlive{overflow:auto;max-height:46vh}
@media (min-width:861px) and (max-height:880px){
  .tout{height:clamp(80px,13vh,150px)}
  .hud{max-height:32vh}
  .hud.withterm{max-height:36vh}
  .hud.withterm #hudlive{max-height:calc(36vh - 50px)}
  .story{padding-top:12px;padding-bottom:12px}
  .st-body>p{font-size:14px;line-height:1.5}
}
.tbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.tchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tchips button{flex:none}
.tchips button{font:500 11.5px var(--mono);color:var(--ink);background:var(--fill);border:0;border-radius:8px;padding:5px 9px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchips button:hover{background:var(--card)}
.tout{background:var(--codebg);color:var(--codefg);border-radius:12px 12px 0 0;padding:10px 12px;font:12px/1.5 var(--mono);height:clamp(120px,19vh,220px);overflow:auto}
.tout pre{margin:0 0 10px;white-space:pre;overflow-x:auto;font:inherit;color:#d1d4d8}
.tout pre.te{color:#ff8a80}
.tout .tp{color:#7ee0c3;font-weight:600}
.tout .tw{color:#8e8e93;white-space:pre-wrap}
.tin{display:flex;align-items:center;gap:8px;background:var(--codebg);border-radius:0 0 12px 12px;padding:9px 12px;margin-top:-8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tin span{color:#7ee0c3;font:600 13px var(--mono)}
.tin input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--codefg);font:13px var(--mono)}
.tin input::placeholder{color:#6e6e73}
.mtree{display:flex;flex-direction:column;gap:8px;font-size:13px}
.mt-top{font-size:14px}
.mt-sl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.mt-sl div{display:flex;gap:3px}
.mt-sl i{flex:1;height:14px;border-radius:3px}
.mt-gi{border-left:3px solid var(--c);background:var(--card);border-radius:0 10px 10px 0;padding:8px 10px}
.mt-h{display:flex;align-items:center;gap:8px;font-weight:600}
.mt-h i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mt-ci{margin-top:4px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.mt-ci.mt-warn{color:var(--bad)}
.mt-p{font:500 12px var(--mono);color:var(--ink);background:var(--fill);border-radius:6px;padding:2px 6px}
.mt-none{font-size:12px}
.fsteps{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0;padding:0;list-style:none}
.fsteps li{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--fill);color:var(--muted)}
.fsteps li.on{background:var(--accent);color:#fff}
.fsteps li.ok{color:var(--ok)}
.p3tbl{width:100%;border-collapse:collapse;font-size:12px}
.p3tbl th,.p3tbl td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.p3tbl th{color:var(--muted);font-weight:500}
.nrow{display:grid;grid-template-columns:56px auto 1fr;gap:10px;align-items:center;font-size:12px}
.ncell{display:flex;gap:3px}
.ncell i{width:14px;height:14px;border-radius:3px;display:block}
.bring{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;font-size:12.5px}
.bring li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.bring li b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:11px;flex:none}
.bring li.ok{color:var(--ink)}
.bring li.ok b{background:var(--ok);color:#fff}
.bring li.fail{color:var(--bad)}
.bring li.fail b{background:var(--bad);color:#fff}
.bring li.cur{color:var(--ink);font-weight:600}
.fqw{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}
.fqnav{display:flex;justify-content:space-between}
.mt-meta{margin-top:2px;font-size:12px;color:var(--muted)}
.mt-add{font-family:inherit;font-size:11.5px;font-weight:500;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
.mt-add:hover{text-decoration:underline}
.ilist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5}
.mt-p button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font:inherit}
.mt-p button:hover{color:var(--bad)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.duo .big{font-size:26px}
.readout p.now{margin:0;font-size:14px;line-height:1.55}
.mm{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.mat{display:grid;grid-template-columns:repeat(2,34px);gap:4px}
.mat span{height:34px;display:grid;place-items:center;border-radius:8px;background:var(--fill);font-weight:500}
.mat span.hl{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-weight:600}
.mat span.hl2{background:var(--accent);color:#fff;font-weight:600}
.mm .op{font-size:18px;color:var(--muted)}
.plgpu{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:4px}
.plgpu span{font-size:11px;border-left:3px solid;padding:3px 7px;background:var(--fill);border-radius:0 6px 6px 0;line-height:1.35;color:var(--muted)}
.plgpu b{display:block;font-size:11.5px;color:var(--ink);font-weight:600}
.plgantt{display:grid;gap:2px;align-items:center}
.plgantt .plbl{font-size:11px;color:var(--muted);padding-right:6px;white-space:nowrap}
.plgantt i{height:16px;border-radius:3px;display:grid;place-items:center;color:#fff;font:600 10px var(--sans)}
.plgantt i.idle{background:var(--fill)}

.hintbar{display:none;position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:12px;color:var(--muted);pointer-events:none}
.gpop{position:fixed;z-index:20;max-width:300px;padding:12px 14px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px;box-shadow:0 0 0 .5px var(--line),0 10px 30px var(--shade);font-size:14px;line-height:1.5}
.gpop b{display:block;margin-bottom:2px;font-weight:600}
.sheetwrap{position:fixed;inset:0;z-index:30;background:var(--shade);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px var(--shade)}
.sheet .phead{padding:16px 20px 6px}
.sheet .phead span{font-size:22px;font-weight:700;color:var(--ink)}
.sheetbody{overflow:auto;padding:8px 20px 24px}
.tabs2{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:14px;padding:2px;background:var(--fill);border-radius:10px;width:fit-content;max-width:100%}
.tabs2 button{font-size:13px;font-weight:500;color:var(--ink);background:none;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.gloss{background:var(--card);border-radius:14px;padding:4px 16px 12px;margin:0}
.gloss dt{font-weight:600;margin-top:12px}
.gloss dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.gsearch{width:100%;font:15px var(--sans);padding:9px 12px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);margin-bottom:12px}
.pg-sum{margin:0;font-size:15px}
.pg-sum b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.plist{display:flex;flex-direction:column;margin-top:14px;background:var(--card);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:28px 1fr 56px;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer;color:var(--ink);font-size:14px}
.prow+.prow{box-shadow:inset 0 .5px 0 var(--line)}
.prow:hover{background:var(--fill)}
.prow .pn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--fill);color:var(--muted)}
.prow.done .pn{background:var(--ok);color:#fff}
.prow .pt{display:flex;flex-direction:column;gap:6px;min-width:0}
.prow .pt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pv{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.domain{display:grid;grid-template-columns:1fr 120px 44px;gap:12px;align-items:center;font-size:14px;padding:10px 0}
.domain+.domain{box-shadow:inset 0 .5px 0 var(--line)}
.domain span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.advb{flex:none;font-size:10.5px;font-weight:600;color:var(--mig);background:color-mix(in srgb,var(--mig) 14%,transparent);border-radius:999px;padding:1px 7px}
.lesson h2 .advb{font-size:13px;vertical-align:middle;padding:2px 9px;letter-spacing:0}
.recap{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.recap li{display:grid;grid-template-columns:54px 1fr;gap:8px;align-items:baseline;font-size:14px;line-height:1.5}
.recap .linkbtn{font-size:12px;font-weight:600;padding:0;text-align:left}
.story.min .recap{display:none}
.prow{grid-template-columns:28px 1fr auto}
.dsl{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px;line-height:1.5}
.dsl li{color:var(--ink);opacity:.42;transition:opacity .2s}
.dsl li.on{opacity:1}
.dsl li b{color:var(--ink);margin-right:2px}
.tb2{gap:10px}
.stepnav{display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 600px;margin-left:8px}
.stepnav .tbtn{padding:6px 13px;font-size:16px;line-height:1.1}
.stepnow{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:5px 14px 5px 5px;font:500 13.5px var(--sans);letter-spacing:-.01em;cursor:pointer;text-align:left}
.stepnow:hover{filter:brightness(.97)}
.snp{flex:none;font-size:12px;color:var(--muted);padding-left:8px}
.snn{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:600;padding:0 4px;box-sizing:border-box}
.snt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.snd{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tbtn.more{font-weight:700;letter-spacing:1px;padding:6px 12px}
.menu{position:fixed;z-index:25;width:250px;padding:6px;display:flex;flex-direction:column;gap:6px;border-radius:16px}
.mgrp{display:flex;flex-direction:column;background:var(--card);border-radius:12px;overflow:hidden}
.mgl{font-size:11.5px;color:var(--muted);padding:9px 12px 3px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;text-align:left;font:400 14px var(--sans);color:var(--ink);background:none;border:0;border-radius:0;padding:10px 12px;cursor:pointer}
.mitem+.mitem{box-shadow:inset 0 .5px 0 var(--line)}
.mitem:hover{background:var(--fill)}
.mrow{cursor:default}
.mrow:hover{background:none}
.mrow input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;margin:0;width:34px;height:20px;border-radius:999px;background:var(--fill);cursor:pointer;transition:background .2s;flex:none}
.mrow input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.mrow input[type=checkbox]:checked{background:var(--switch)}
.mrow input[type=checkbox]:checked::after{transform:translateX(14px)}
.menu .seg button{font-size:12px;padding:3px 10px}
.menu #btn-help{font-size:14px}
.menu #btn-help::after{content:none}
.psep{font-size:12px;font-weight:600;color:var(--muted);padding:14px 16px 6px;background:var(--bg)}
.psep:first-child{padding-top:4px}
.prow.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.prow.cur .pt b{color:var(--accent);font-weight:600}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'펼치기';font-size:12px;color:var(--accent)}
details.fold[open]>summary::after{content:'접기'}
details.fold:not([open])>summary{padding-bottom:0}
.tag:not(.big):not(.gpu):not(.sel):not(.mmtag){font-size:11px;padding:4px 8px;color:var(--muted);background:color-mix(in srgb,var(--tagbg) 82%,transparent);box-shadow:none}
@media (max-width:860px){
  .tb2 h1{display:none}
  .stepnav{flex:1;margin-left:0}
  .snp,.snd{display:none}
  .topbar .row.tb2{overflow:visible}
}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){
  .side{right:max(12px,env(safe-area-inset-right,0px));width:auto;border-radius:16px}
  .side .phead{display:none}
  .sidebody{flex-direction:row;overflow-x:auto;padding:8px;gap:10px;align-items:center}
  .grp{flex:none;flex-direction:row;align-items:center;gap:4px}
  .grp>.gl{display:none}
  .grp:has(.legend){display:none}
  .grp>.opt{border-radius:999px!important;box-shadow:none!important;padding:6px 12px;white-space:nowrap}
  .opt i,.opt small{display:none}
  .optrow{flex-wrap:nowrap}
  .range{border-radius:999px;flex-direction:row;align-items:center;white-space:nowrap}
  .panel{left:max(12px,env(safe-area-inset-left,0px));width:auto;max-height:46vh}
  .story{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));padding:12px 14px}
  .st-body h3{font-size:18px}
  .st-body>p{font-size:14px}
  .hud{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-height:20vh}
  .hud.withterm{grid-template-columns:1fr;max-height:48vh;overflow:auto}
  .hud.withterm #hudlive{max-height:none}
  .tout{height:16vh}
  .lesson h2{font-size:24px}
  .hintbar{display:none}
  h1{font-size:15px}
  .hidem{display:none!important}
  .topbar .row:first-child{overflow-x:auto;scrollbar-width:none}
  .topbar .row:first-child::-webkit-scrollbar{display:none}
  .topbar .row:first-child .tbtn{flex:none}
  #btn-help{font-size:0;padding:6px 11px}
  #btn-help::after{content:'?';font-size:13px}
}
/* ===== v34: 알약·동그라미를 줄이고 작은 모서리와 얇은 선으로 ===== */
:root{--r1:6px;--r2:8px;--r3:10px}
.fl{border-radius:var(--r3);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(140%) blur(16px);backdrop-filter:saturate(140%) blur(16px);box-shadow:0 0 0 1px var(--line),0 8px 28px rgba(0,0,0,.12)}
.topbar{padding:8px 10px 0 16px;gap:0}
h1{font-size:15px;letter-spacing:-.01em}
.tbtn{border-radius:var(--r1);background:none;box-shadow:inset 0 0 0 1px var(--line);padding:5px 11px;font-weight:500}
.tbtn:hover{background:var(--fill);filter:none}
.tbtn.primary{background:var(--accent);color:#fff;box-shadow:none}
.tbtn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.seg{border-radius:var(--r1);padding:2px}
.seg button{border-radius:4px}
.stepnav .tbtn{padding:5px 11px;font-size:15px}
.stepnow{border-radius:var(--r1);background:none;box-shadow:inset 0 0 0 1px var(--line);padding:5px 12px;gap:10px}
.stepnow:hover{background:var(--fill);filter:none}
.snn{background:none;color:var(--accent);font:600 12.5px var(--mono);min-width:0;height:auto;padding:0;border-radius:0}
.snp{padding-left:0;font-weight:500}
.snp::after{content:"/";margin-left:10px;color:var(--line)}
.strip{display:flex;align-items:flex-end;gap:2px;height:12px;margin:6px 0 0;padding-bottom:6px;cursor:pointer}
.strip i{flex:1;height:3px;background:var(--fill);transition:height .15s}
.strip i.gap{margin-left:7px}
.strip i.done{background:color-mix(in srgb,var(--ok) 75%,transparent)}
.strip i.cur{background:var(--accent);height:5px}
.strip i:hover{height:6px}
.dots{gap:3px}
.dots button{width:14px;height:3px;border-radius:0}
.dots button.on{width:14px;background:var(--accent)}
.st-body h3{font-size:19px;font-weight:650}
.pill .n,.hrow>b,.bring li b,.mt-h i{border-radius:4px}
.prow .pn{width:auto;min-width:24px;height:auto;background:none;color:var(--muted);font:500 12px var(--mono);border-radius:0}
.prow.done .pn{background:none;color:var(--ok)}
.grp>.gl+.opt,.grp>.opt:first-child{border-top-left-radius:var(--r2);border-top-right-radius:var(--r2)}
.grp>.opt:last-child{border-bottom-left-radius:var(--r2);border-bottom-right-radius:var(--r2)}
.grp>.opt{box-shadow:inset 0 0 0 .5px var(--line)}
.optrow{border-radius:var(--r1)}
.optrow .opt{border-radius:4px}
.range{border-radius:0 0 var(--r2) var(--r2)}
.chip{border-radius:var(--r1);background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{background:var(--fill)}
.chip[aria-pressed="true"]{background:var(--accent);box-shadow:none}
.actbtn{border-radius:var(--r1);font-size:14px;padding:9px 12px}
.actbtn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.legend,.readout,.info,.tbl,.mxwrap,.adv,.disc,.mini,.qopts,.plist,.gloss,.hrow,.myth li,.mt-gi,.nest div{border-radius:var(--r2)}
.sheet{border-radius:var(--r3)}
.sheetbody .tabs2,.tabs2 button{border-radius:var(--r1)}
.gsearch{border-radius:var(--r1)}
.tout{border-radius:var(--r1) var(--r1) 0 0}
.tin{border-radius:0 0 var(--r1) var(--r1)}
.tchips button{border-radius:4px}
.hudtabs{background:none;padding:0;gap:16px;border-radius:0;margin-top:-2px}
.hudtabs button{border-radius:0;padding:2px 0 3px;background:none!important;box-shadow:none!important;border-bottom:2px solid transparent}
.hudtabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.tag{border-radius:4px}
.gpop,.menu{border-radius:var(--r2)}
.mgrp{border-radius:var(--r1)}
pre.cmd,.code,.cell,.mat span{border-radius:var(--r1)}
.advb{border-radius:4px}
.fsteps li{border-radius:4px}

(function(){
const $ = s => document.querySelector(s);

const GLOSS = {

/* ================= 비교표 ================= */
const COMPARE = {
  cpugpu:{title:'CPU vs GPU', html:`<table class="t"><thead><tr><th></th><th>CPU</th><th>GPU</th></tr></thead><tbody>

  train:{title:'학습 vs 추론', html:`<table class="t"><thead><tr><th></th><th>학습</th><th>추론</th></tr></thead><tbody>
    <tr><td>하는 일</td><td>가중치를 반복해서 고침</td><td>정해진 가중치로 답만 냄</td></tr>
    <tr><td>계산량</td><td>매우 큼 (몇 시간~몇 주)</td><td>요청당 작음, 대신 요청이 많음</td></tr>

/* ---------- 0단계: CPU vs GPU 계산 (8×8 행렬 곱셈 C = A × B) ---------- */
/* 1틱 = 코어가 곱하기-더하기를 할 수 있는 시간 단위. CPU 코어는 1틱에 1번, GPU 코어는 2틱에 1번(코어 하나는 더 느림).
   CPU 코어 8개는 C를 한 행씩(8칸) 나눠 맡고, GPU 코어 64개는 C 64칸을 하나씩 맡는다. */
const MN=8, PITCH=0.56, TILE=0.5, CPU_TICKS=MN*MN, GPU_TICKS=MN*2;
const cpuK=(idx,t)=>Math.max(0,Math.min(MN,t-MN*Math.floor(idx/MN)));
const gpuK=t=>Math.max(0,Math.min(MN,Math.floor(t/2)));
function buildCompute(){
  reset();
  const sides=[];
  [[-6.4,'cpu'],[6.4,'gpu']].forEach(([ox,kind])=>{
    box(10.6,0.3,13,0x2d3236,ox,-0.15,-0.1,'board',{metal:.3,rough:.7});
    const ax=ox-2.64, cx=ox+2.48, cz=1.0, bz=-4.0;
    const pos=(gx,gz,i,j)=>[gx-(MN-1)*PITCH/2+j*PITCH, gz-(MN-1)*PITCH/2+i*PITCH];
    const grid=(gx,gz,key,h)=>{
      /* 무광으로 두어야 강조 색(주황·청록)이 조명에 씻기지 않는다 */
      const im=new THREE.InstancedMesh(new THREE.BoxGeometry(TILE,h,TILE),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.95,metalness:0,envMapIntensity:.15}),MN*MN);
      const m4=new THREE.Matrix4(), c=new THREE.Color(0x4a5056);
      for(let i=0;i<MN;i++) for(let j=0;j<MN;j++){ const [x,z]=pos(gx,gz,i,j); m4.makeTranslation(x,h/2,z); im.setMatrixAt(i*MN+j,m4); im.setColorAt(i*MN+j,c); }
      im.instanceColor.needsUpdate=true; grpFor(typeOf(key)).add(im); tag(im,key); return im;
    };
    const A=grid(ax,cz,'matrix',0.06), B=grid(cx,bz,'matrix',0.06), C=grid(cx,cz,'tiles',0.08);
    label('A',ax,0.5,cz-MN*PITCH/2-0.45,'big','matrix');
    label('B',cx-MN*PITCH/2-0.55,0.5,bz,'big','matrix');
    label('C = A × B',cx+MN*PITCH/2+0.2,0.5,cz-MN*PITCH/2-0.45,'big','tiles');
    label(kind==='cpu'?'CPU · 큰 코어 8개':'GPU · 작은 코어 64개 (실제는 수천 개)',ox,1.4,7.0,'big','cores');
    let cores;
    if(kind==='cpu'){
      cores=[];
      for(let j=0;j<MN;j++){ const [x]=pos(cx,cz,0,j); cores.push(box(0.5,0.7,0.9,0x7a8086,x,0.35,4.9,'cores',{metal:.5,rough:.4})); }
    } else {
      const im=new THREE.InstancedMesh(new THREE.BoxGeometry(0.2,0.25,0.2),new THREE.MeshStandardMaterial({color:0xffffff,metalness:.4,roughness:.5}),MN*MN);
      const m4=new THREE.Matrix4(), c=new THREE.Color(0x7a8086);
      for(let i=0;i<MN;i++) for(let j=0;j<MN;j++){ const [x]=pos(cx,cz,0,j); m4.makeTranslation(x,0.13,4.25+i*0.26); im.setMatrixAt(i*MN+j,m4); im.setColorAt(i*MN+j,c); }
      im.instanceColor.needsUpdate=true; grpFor('cores').add(im); tag(im,'cores'); cores=im;
    }
    const lines=fatLines([0,0,0,0,0,0.01],kind==='cpu'?0xd98a3a:0x2f9e8c,2.2,.9);
    lines.frustumCulled=false; world.add(lines);
    /* 지금 곱하는 재료에 붙는 이름표: A의 가로줄, B의 세로줄, 채우는 C 칸 */
    const tg=t=>{ const el=document.createElement('div'); el.className='tag mmtag'; el.style.background=kind==='cpu'?'#d98a3a':'#2f9e8c'; el.textContent=t; const o=new THREE.CSS2DObject(el); world.add(o); return o; };
    const tags={a:tg('A의 가로줄'),b:tg('B의 세로줄'),c:tg('C의 이 칸')};
    sides.push({kind,A,B,C,cores,lines,pos,ax,cx,cz,bz,lit:null,tags});
  });
  compute={sides,t:0,running:false,last:0};
  renderCompute();
}
function renderCompute(){
  if(!compute) return;
  const t=compute.t, idle=new THREE.Color(0x4a5056), base=new THREE.Color(0x3c4349), used=new THREE.Color(), now=new THREE.Color(0xffffff);
  compute.sides.forEach(s=>{
    const cpu=s.kind==='cpu', col=new THREE.Color(cpu?0xd98a3a:0x2f9e8c), total=cpu?CPU_TICKS:GPU_TICKS, working=t<total;
    const m4=new THREE.Matrix4(), sc=new THREE.Matrix4(), c=new THREE.Color();
    const row=Math.min(MN-1,Math.floor(t/MN));
    /* 강조할 칸: CPU는 코어 0이 맡은 칸, GPU는 C[0,0]을 예로 */
    const fi=cpu?row:0, fj=0, fk=cpu?cpuK(fi*MN,t):gpuK(t);
    for(let i=0;i<MN;i++) for(let j=0;j<MN;j++){
      const idx=i*MN+j, k=cpu?cpuK(idx,t):gpuK(t), f=k/MN, h=0.08+f*1.2;
      const [x,z]=s.pos(s.cx,s.cz,i,j);
      sc.makeScale(1,h/0.08,1); m4.makeTranslation(x,h/2,z).multiply(sc); s.C.setMatrixAt(idx,m4);
      c.copy(idle); if(k>0) c.lerp(col,0.35+0.65*f);
      if(working&&i===fi&&j===fj) c.lerp(now,0.35);
      s.C.setColorAt(idx,c);
    }
    s.C.instanceMatrix.needsUpdate=true; s.C.instanceColor.needsUpdate=true;
    used.copy(col).lerp(base,0.6);
    for(let i=0;i<MN;i++) for(let j=0;j<MN;j++){
      const idx=i*MN+j;
      let a=base, b=base;
      if(working){
        if(i===fi) a=(j===fk-1)?now:(j<fk?used:col.clone().lerp(base,0.15));
        if(j===fj) b=(i===fk-1)?now:(i<fk?used:col.clone().lerp(base,0.15));
      }
      s.A.setColorAt(idx,a); s.B.setColorAt(idx,b);
    }
    s.A.instanceColor.needsUpdate=true; s.B.instanceColor.needsUpdate=true;
    { const show=working&&fk>0&&S.step===0, T=s.tags; [T.a,T.b,T.c].forEach(o=>o.visible=show);
      if(show){ const [, az]=s.pos(s.ax,s.cz,fi,0), [bx]=s.pos(s.cx,s.bz,0,fj), [cx2,cz2]=s.pos(s.cx,s.cz,fi,fj);
        T.a.position.set(s.ax-MN*PITCH/2-0.25,0.3,az); T.a.element.textContent=`A의 ${fi+1}번째 가로줄`;
        T.b.position.set(bx,0.3,s.bz-MN*PITCH/2+0.1); T.b.element.textContent=`B의 ${fj+1}번째 세로줄`;
        T.c.position.set(cx2,0.4+fk/MN*1.2,cz2); T.c.element.textContent=`C의 이 칸 · 곱셈 ${fk}/${MN}번`; } }
    /* 코어 ↔ 맡은 칸 연결선 */
    const lp=[]; const put=(x1,y1,z1,x2,y2,z2)=>lp.push(x1,y1,z1,x2,y2,z2);
    if(working){
      if(cpu){ for(let j=0;j<MN;j++){ const [x,z]=s.pos(s.cx,s.cz,row,j), k=cpuK(row*MN+j,t); put(x,0.72,4.45,x,0.12+k/MN*1.2,z); } }
      else { for(let i=0;i<MN;i++) for(let j=0;j<MN;j++){ const [x,z]=s.pos(s.cx,s.cz,i,j); put(x,0.27,4.25+i*0.26,x,0.12+gpuK(t)/MN*1.2,z); } }
    }
    if(lp.length) s.lines.geometry.setPositions(lp);
    s.lines.visible=S.clines&&lp.length>0;
    /* 일하는 코어만 불 켜기 */
    const lit=working&&(t>0||compute.running);
    if(s.lit!==lit){
      s.lit=lit;
      if(cpu) s.cores.forEach(m=>{ m.material.emissive.setHex(lit?0xd98a3a:0); m.material.emissiveIntensity=lit?.6:0; });
      else { const cc=new THREE.Color(lit?0x3cc3ac:0x7a8086); for(let i=0;i<MN*MN;i++) s.cores.setColorAt(i,cc); s.cores.instanceColor.needsUpdate=true; }
    }
  });
}
function computeAction(act){
  if(!compute) return;
  if(act==='run'){
    if(compute.t>=CPU_TICKS) compute.t=0;
    compute.running=!compute.running; compute.last=0;
    if(compute.running&&reduce){ compute.t=CPU_TICKS; compute.running=false; }
  } else if(act==='step'){ compute.running=false; if(compute.t<CPU_TICKS) compute.t++; }
  else if(act==='creset'){ compute.running=false; compute.t=0; }
  renderCompute(); renderLive(); renderLeft();
}
function computeTick(now){
  if(!compute||!compute.running) return;
  const ms=S.slow?650:200;
  if(now-compute.last<ms) return;
  compute.last=now; compute.t++;
  if(compute.t>=CPU_TICKS){ compute.t=CPU_TICKS; compute.running=false; renderLeft(); }
  renderCompute(); renderLive();
}

function chainIdx(ch,id){ return ch.findIndex(w=>w[0]===id); }
function viaChains(chains,a,b){
  const A=chains[a],B=chains[b]; let ia=-1,ib=-1;
  for(let i=0;i<A.length&&ia<0;i++){ if(!A[i][0]) continue; const j=chainIdx(B,A[i][0]); if(j>=0){ ia=i; ib=j; } }
  return A.slice(0,ia+1).concat(B.slice(0,ib).reverse());
}
function toRoute(ws){
  const steps=[]; ws.forEach(w=>{ if(w[1]&&steps[steps.length-1]!==w[1]) steps.push(w[1]); });
  return {points:ws.map(w=>V(w[2],w[3],w[4])),steps};
}
function pairRoute(a,b,l){
  if(l.kind==='mig') return null;
  let ws;
  if(S.mode==='card'){
    if(l.kind==='nv'){ ws=[['G0','GPU0',-7.2,3.4,3.3],[null,null,-7.2,3.5,1.2],['BR','NVLink 브리지',-6,3.6,1.2],[null,null,-4.8,3.5,1.2],['G1','GPU1',-4.8,3.4,3.3]]; if(a>b) ws.reverse(); }
    else ws=viaChains(cardChains,a,b);
  } else {
    if(l.kind==='nv'){
      const mx=(gx(a)+gx(b))/2, sx=NVS_X.reduce((p,c)=>Math.abs(c-mx)<Math.abs(p-mx)?c:p), e=i=>i<4?2.6:5.8;
      ws=[['G'+a,'GPU'+a,gx(a),2.0,gz(a)],['L1','NVLink 배선',gx(a),T,e(a)],['NS','NVSwitch',sx,0.7,4.2],['L2','NVLink 배선',gx(b),T,e(b)],['G'+b,'GPU'+b,gx(b),2.0,gz(b)]];
    } else ws=viaChains(sxmChains,a,b);
  }
  return toRoute(ws);
}
function gpuToCpuRoute(g){ const ch=cardChains[g]; return toRoute(ch.slice(0,chainIdx(ch,'CPU'+cardCpu(g))+1)); }
function numaRoute(c,g){
  const ch=cardChains[g];
  if(cardCpu(g)===c) return toRoute(ch.slice(0,chainIdx(ch,'CPU'+c)+1).reverse());
  return toRoute(CPUC[c].concat(ch.slice(0,chainIdx(ch,'UPI')).reverse()));
}
function viaMemRoute(a,b){
  const A=cardChains[a], B=cardChains[b], ca=cardCpu(a), cb=cardCpu(b);
  const up=A.slice(0,chainIdx(A,'CPU'+ca)+1);
  const mx=ca?8.2:-8.2;
  const mem=[[null,null,ca?3.4:-3.4,T,-4],[null,null,ca?3.4:-3.4,0.9,-6.8],['MEM','CPU 메모리 (RAM)',mx,1.4,-6.8],[null,null,ca?3.4:-3.4,0.9,-6.8],['CPU'+ca,'CPU '+ca,ca?5:-5,1.2,-4]];
  let rest;
  if(ca===cb) rest=B.slice(0,chainIdx(B,'CPU'+cb)).reverse();
  else rest=CPUC[ca].slice(1).concat(B.slice(0,chainIdx(B,'UPI')).reverse());
  return toRoute(up.concat(mem,rest));
}

function addPath(points,color,speed,radius=0.1,text){

  const glow=new THREE.Mesh(halo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false,toneMapped:false}));

  tg.dispose(); tube.renderOrder=10; glow.renderOrder=10; ghost.renderOrder=9; obj.add(ghost); obj.add(glow); obj.add(tube);

    s.renderOrder=11; h.renderOrder=11; s.userData.off=k/n; s.position.copy(cp.getPointAt(k/n)); obj.add(s); packets.push(s); }

/* 꺾이는 곳을 둥글게 이어 경로가 각도에 따라 끊겨 보이지 않게 한다 */
function smoothCurve(points){
  const cp=new THREE.CurvePath(), P=points.filter((p,i)=>i===0||p.distanceTo(points[i-1])>1e-4);
  if(P.length<2) return cp;
  let start=P[0].clone();
  for(let i=1;i<P.length-1;i++){
    const a=P[i-1],b=P[i],c=P[i+1], d1=b.clone().sub(a), d2=c.clone().sub(b), r=Math.min(0.45,d1.length()*0.45,d2.length()*0.45);
    const p1=b.clone().add(d1.normalize().multiplyScalar(-r)), p2=b.clone().add(d2.normalize().multiplyScalar(r));
    if(start.distanceTo(p1)>1e-4) cp.add(new THREE.LineCurve3(start,p1));
    cp.add(new THREE.QuadraticBezierCurve3(p1,b.clone(),p2)); start=p2;
  }
  const end=P[P.length-1]; if(start.distanceTo(end)>1e-4) cp.add(new THREE.LineCurve3(start,end));
  return cp;
}
function drawPath(points,color,speed,radius){ clearPath(); addPath(points,color,speed,radius); }

{ part:'1부', title:'PCIe: 서버 안의 기본 도로', scene:'card', dom:['A2'], badges:[['a','Associate · AI 인프라']],
  cam:{p:[10,16,20],t:[-3.5,0.5,-0.5]},
  goals:['레인 수와 세대로 대역폭이 어떻게 정해지는지 계산할 수 있습니다','슬롯, 스위치, 루트 포트가 각각 무엇인지 압니다','서버에서 GPU의 PCIe 연결 상태를 확인하는 명령을 알게 됩니다'],
  key:['PCIe 속도는 레인 수 × 세대별 레인 속도입니다. 세대가 오를 때마다 두 배가 됩니다.','GPU는 보통 x16 레인을 씁니다. Gen4 x16이면 한 방향으로 약 32 GB/s입니다.','GPU에서 나간 데이터는 슬롯과 스위치를 지나 CPU의 루트 포트로 들어갑니다. 스위치가 없는 경우도 있습니다.'],
  body:()=>`
   <div class="sec prose"><h3>도로로 비유하면</h3><p>${gl('[[레인]]')} 수는 차로가 몇 개인지, 세대는 제한 속도라고 생각하면 됩니다. 차로를 두 배로 늘리거나 제한 속도를 두 배로 올리면 같은 시간에 두 배를 나를 수 있습니다. 3D에서는 선의 굵기가 레인 수, 점이 흐르는 속도가 대역폭입니다.</p>
    <p>경로는 GPU2 → ${gl('[[슬롯]]')} → 보드 속 배선 → CPU 0의 ${gl('[[루트 포트]]')} 순서입니다. GPU0과 GPU1처럼 ${gl('[[PCIe 스위치]]')}를 거치는 경우도 있습니다. 스위치 아래 장치들은 위로 올라가는 통로 하나를 나눠 씁니다.</p></div>
   <div class="sec"><h3>세대별 속도</h3><div class="tbl">${COMPARE.pcie.html}</div></div>
   <div class="sec"><h3>서버에서 확인하기</h3>
    <pre class="cmd">lspci -tv</pre><p class="note">PCIe 장치를 나무 모양으로 보여 줍니다. 어떤 장치가 어느 스위치와 루트 포트 아래 있는지 알 수 있습니다.</p>
    <pre class="cmd">nvidia-smi --query-gpu=pcie.link.gen.current,pcie.link.width.current --format=csv</pre><p class="note">GPU마다 지금의 세대와 레인 수를 보여 줍니다. GPU가 쉬고 있을 때는 전력을 아끼려고 세대가 낮게 보일 수 있습니다.</p></div>`,
  live:()=>{ const bw=bwPcie(); return `<div class="readout"><div class="sub">PCIe Gen${S.gen} x${S.lanes}</div>

{ part:'1부', title:'CPU가 둘일 때: 소켓과 NUMA', scene:'card', dom:['A2','P'], badges:[['a','Associate · AI 인프라'],['p','Professional · 최적화 (심화)']],
  cam:{p:[2,22,20],t:[0,0.5,-1]},
  goals:['NUMA가 무엇이고 왜 생기는지 설명할 수 있습니다','작업을 GPU와 가까운 CPU에 붙여야 하는 이유를 압니다','NUMA 정보를 확인하고 지정하는 명령을 알게 됩니다'],
  key:['2소켓 서버는 메모리와 PCIe 장치가 CPU별로 나뉘어 있습니다. 이걸 NUMA라고 합니다.','자기 쪽 GPU와 메모리는 빠르고, 반대편 것은 소켓 간 연결을 건너야 해서 느립니다.','그래서 작업은 그 작업이 쓰는 GPU와 같은 NUMA 노드의 CPU에 붙입니다.'],
  body:()=>`
   <div class="sec prose"><h3>무슨 일이 일어나나</h3><p>CPU마다 자기 메모리와 PCIe 출구가 있습니다. GPU3은 CPU 1에 붙어 있습니다. 그래서 CPU 0에서 도는 프로그램이 GPU3에 데이터를 보내려면 ${gl('[[UPI]]')}를 건너야 합니다. AMD CPU라면 ${gl('[[Infinity Fabric]]')}을 건넙니다. 이 길을 건너면 대역폭이 줄고 ${gl('[[지연]]')}이 늘어납니다.</p>
    <p>왼쪽에서 <b>작업이 도는 CPU</b>와 <b>쓰는 GPU</b>를 바꿔 보세요. 바닥 색이 같은 쪽끼리 짝지으면 길이 짧아집니다.</p></div>
   <div class="sec"><h3>확인하고 붙이기</h3>
    <pre class="cmd">lscpu | grep NUMA</pre><p class="note">NUMA 노드가 몇 개인지, 노드마다 어떤 CPU 번호가 있는지 보여 줍니다.</p>
    <pre class="cmd">nvidia-smi topo -m</pre><p class="note">표 오른쪽의 CPU Affinity, NUMA Affinity 열이 GPU마다 가까운 CPU를 알려 줍니다.</p>
    <pre class="cmd">numactl --cpunodebind=1 --membind=1 python train.py</pre><p class="note">GPU3을 쓰는 작업을 NUMA 노드 1의 CPU와 메모리에 붙여서 실행합니다. 이렇게 붙이는 걸 ${gl('[[affinity]]')}라고 합니다.</p></div>
   <div class="sec"><div class="adv"><b>심화 · AMD와 Intel</b><br>AMD EPYC는 BIOS의 ${gl('[[NPS]]')} 설정으로 소켓 하나를 NUMA 노드 1개, 2개, 4개로 나눕니다. NPS4면 같은 소켓 안에서도 노드가 달라서 ${gl('[[토폴로지]]')} 코드가 SYS로 보일 수 있습니다. Intel에서는 SNC(Sub-NUMA Clustering)가 비슷한 역할을 합니다. 서버 성능을 맞출 때는 BIOS 설정과 CPU 전원 모드를 같이 보고, 메모리 채널을 모두 채웠는지도 확인합니다.</div></div>`,
  live:()=>{ const near=cardCpu(S.numaGpu)===S.numaCpu; return `<div class="readout"><div class="sub">CPU ${S.numaCpu}에서 도는 작업 → GPU${S.numaGpu} (GPU${S.numaGpu}는 NUMA ${cardCpu(S.numaGpu)})</div>
     <div class="big" style="color:var(${near?'--ok':'--bad'})">${near?'가까움 (로컬)':'멂 (원격)'}</div>
     <div class="sub">${near?'소켓 간 연결을 건너지 않습니다. 이렇게 짝지어야 합니다.':'소켓 간 연결을 건넙니다. 대역폭이 줄고 지연이 늘어납니다. CPU '+cardCpu(S.numaGpu)+'로 옮기면 해결됩니다.'}</div></div>`; },
  compare:[],
  quiz:{q:'GPU3을 쓰는 학습 작업을 CPU 0에서 돌리면 어떻게 됩니까?',opts:['차이가 없습니다','소켓 간 연결을 건너서 데이터 전송이 느려집니다','GPU3을 아예 쓸 수 없습니다'],a:1,ex:'쓸 수는 있지만 매번 소켓 간 연결을 건너야 해서 느려집니다. GPU3과 같은 NUMA 노드인 CPU 1에 붙이는 것이 맞습니다.'}},
{ part:'1부', title:'NVLink와 NVSwitch', scene:'topo', dom:['A2'], badges:[['a','Associate · AI 인프라']],

{ part:'1부', title:'P2P와 GPUDirect', scene:'p2p', dom:['A2'], badges:[['a','Associate · AI 인프라']],

   <div class="sec"><h3>GPUDirect 묶음</h3><div class="tbl"><table class="t"><thead><tr><th>이름</th><th>누구와 직접</th><th>효과</th></tr></thead><tbody>

   <div class="sec"><h3>서버에서 확인하기</h3><pre class="cmd">nvidia-smi topo -p2p r</pre><p class="note">GPU 쌍마다 P2P 읽기가 되는지 표로 보여 줍니다. OK, NS 같은 값이 나옵니다.</p>

{ part:'1부', title:'GPU 나눠 쓰기와 가상화', scene:'mig', dom:['A3','P'], badges:[['a','Associate · AI 운영'],['p','Professional · 물리 계층 (심화)']],

  body:()=>`
   <div class="sec prose"><h3>해 보기</h3><p>왼쪽에서 GPU 모델과 나누는 방법을 고르세요. 가운데 7줄이 ${gl('[[GPC|연산 조각]]')}이고, 위아래 덩어리가 ${gl('[[HBM]]')} 메모리입니다. 같은 색끼리가 한 인스턴스입니다. 연산은 7조각인데 메모리는 8칸이라서, 3g는 메모리를 절반인 4칸 받습니다.</p></div>

function stepCam(){ const st=STEPS[S.step], c=(curScene==='overview'||curScene==='sxm')?SCENE_CAM[curScene]:(st.cam||SCENE_CAM[curScene]||SCENE_CAM[curScene.split('-')[0]]); fitView(c); }
/* 보는 방향은 그대로 두고, 장면 전체가 패널에 가리지 않는 빈 공간 안에 들어오는 거리를 계산한다 */
function fitView(c){
  if(!controls||!world) return;
  const b=new THREE.Box3(), tmp=new THREE.Box3();
  world.traverse(o=>{ if(o.isMesh&&o.visible&&o.geometry&&!(o.material&&o.material.transparent&&o.material.opacity<0.3)){ tmp.setFromObject(o); if(!tmp.isEmpty()) b.union(tmp); } });
  if(b.isEmpty()) return;
  const ctr=b.getCenter(V(0,0,0)), size=b.getSize(V(0,0,0)), dir=V(...c.p).sub(V(...c.t)).normalize();
  const right=new THREE.Vector3().crossVectors(V(0,1,0),dir).normalize(), up=new THREE.Vector3().crossVectors(dir,right).normalize();
  let ex=0,ey=0,ez=0;
  for(const sx of [-1,1]) for(const sy of [-1,1]) for(const sz of [-1,1]){ const q=V(sx*size.x/2,sy*size.y/2,sz*size.z/2); ex=Math.max(ex,Math.abs(q.dot(right))); ey=Math.max(ey,Math.abs(q.dot(up))); ez=Math.max(ez,q.dot(dir)); }
  const v=VIS||{w:view.clientWidth,h:view.clientHeight,W:view.clientWidth,H:view.clientHeight};
  const tanV=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), ty=tanV*(v.h/v.H)*0.92, tx=tanV*(v.W/v.H)*(v.w/v.W)*0.92;
  const dist=Math.max(ex/tx,ey/ty)+ez;
  moveCam(ctr.clone().add(dir.multiplyScalar(dist)),ctr);
}
function applyExplode(){ const e=curScene==='server'?S.explode:0; Object.values(groups).forEach(g=>g.position.y=g.userData.ex*e); }

/* 상태가 바뀔 때마다 3D 경로와 강조를 다시 맞춘다. S.view는 장면이 고른 보기 방식 */

  }
  else if(st===3){

    else if(v!=='floor'){ const r=numaRoute(S.numaCpu,S.numaGpu), near=cardCpu(S.numaGpu)===S.numaCpu; lastRoute=r; addPath(r.points,tokColor(near?'nv':'sys'),near?0.5:0.18); }
  }
  else if(TOPO(st)){
    if(v==='race'&&curScene==='card'){ const nv=pairRoute(0,1,{kind:'nv'}), pc=toRoute(viaChains(cardChains,0,1)); lastRoute=nv; addPath(nv.points,tokColor('nv'),0.7,0.1,'NVLink'); addPath(pc.points,tokColor('pcie'),0.2,0.1,'PCIe'); }
    else if(S.sel.length===2){ const [a,b]=S.sel,l=linkOf(a,b),r=pairRoute(a,b,l); lastRoute=r; if(r) addPath(r.points,tokColor(l.kind),FLOW[l.code].speed); }
  }
  else if(st===5){ const stt=p2pState(), r=stt.direct?toRoute(viaChains(cardChains,0,S.p2pPair)):viaMemRoute(0,S.p2pPair); lastRoute=r; addPath(r.points,tokColor(stt.direct?'pcie':'sys'),stt.direct?(S.p2pPair===1?0.32:0.22):0.1); }
  if(st>=7&&st<=11) part2Paths(st,v);
  if(st>=12&&st<=18) part3Paths(st,v);
  refreshGlow();
}
function numaFloor(){
  if(!world) return;
  const old=world.getObjectByName('numa'); if(old){ old.traverse(o=>{o.geometry&&o.geometry.dispose(); o.material&&o.material.dispose(); if(o.isCSS2DObject&&o.element.parentNode) o.element.remove();}); world.remove(old); }
  if(S.step!==3) return;

}

/* 선택 표시: 부품 위에 같은 모양의 반투명 파란 막을 덮는다. 재질 색을 건드리지 않아서 밝은 금속·어두운 부품 모두 똑같이 파랗게 보이고, 3부의 색 바꾸기(tintKey)와도 섞이지 않는다 */
const ovOn=new Set();
function ovFor(m){ let o=m.userData.ov; if(o) return o; if(!m.isMesh||m.isInstancedMesh||!m.geometry||!m.material) return null;
  o=new THREE.Mesh(m.geometry,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,polygonOffset:true,polygonOffsetFactor:(m.material.polygonOffset?m.material.polygonOffsetFactor:0)-1,polygonOffsetUnits:(m.material.polygonOffset?m.material.polygonOffsetUnits:0)-4,side:m.material.side,toneMapped:false}));
  o.raycast=()=>{}; o.renderOrder=3; o.castShadow=o.receiveShadow=false; o.visible=false; m.add(o); m.userData.ov=o; return o; }
function refreshGlow(){
  const glow=new THREE.Color(css('--glow'));
  ovOn.forEach(o=>{ o.visible=false; o.material.opacity=0; }); ovOn.clear();
  const cover=(k,a)=>(keyMeshes[k]||[]).forEach(m=>{ const o=ovFor(m); if(!o) return; const base=m.material.transparent?(m.material.opacity??1):1; const op=Math.max(o.material.opacity,a*Math.min(1,base*1.4)); if(op<0.02) return; o.material.color.copy(glow); o.material.opacity=op; o.visible=true; ovOn.add(o); });
  Object.values(keyMeshes).flat().forEach(m=>{ if(m.material.emissive){ m.material.emissive.setRGB(0,0,0); m.material.emissiveIntensity=0; } });
  const set=(k,a)=>(keyMeshes[k]||[]).forEach(m=>{ if(m.material.emissive){ m.material.emissive.copy(glow); m.material.emissiveIntensity=Math.max(m.material.emissiveIntensity,a); } });
  let sel=[];
  if(TOPO(S.step)) sel=S.sel; else if(S.step===5) sel=[0,S.p2pPair]; else if(S.step===3) sel=[S.numaGpu]; else if(S.step===2) sel=[2];
  sel.forEach(i=>set(gkey(i),0.4));
  (FOCUS[S.step]||[]).forEach(k=>set(k,0.15));
  (S.termHl||[]).forEach(k=>{ set(k,0.45); cover(k,0.3); });
  if(S.part){ set(S.part,0.32); cover(S.part,0.5); }
  if(hoverKey&&hoverKey!==S.part) cover(hoverKey,0.16);
  gpuLabels.forEach((el,i)=>el&&el.classList.toggle('sel',sel.includes(i)));
}

let lastDecl=0; const declRay=new THREE.Raycaster(), declV=new THREE.Vector3();
function declutter(now){
  if(!labelR||labelR.domElement.hidden||now-lastDecl<250) return; lastDecl=now;
  const items=[]; scene.traverse(o=>{ if(o.isCSS2DObject&&o.element.isConnected&&o.element.style.display!=='none'&&!o.element.hidden) items.push(o); });
  const cam=camera.position, occ=pickables.filter(m=>m.visible&&!(m.material&&m.material.transparent));
  items.forEach(o=>{
    const el=o.element; o.getWorldPosition(declV); const d=declV.distanceTo(cam);
    declRay.set(cam,declV.clone().sub(cam).normalize()); declRay.far=Math.max(0.01,d-0.5);
    const hit=declRay.intersectObjects(occ,false).length>0;
    el.__occ=Math.max(0,Math.min(2,(el.__occ||0)+(hit?1:-1)));
  });
  const pri=el=>el.classList.contains('sel')?4:el.classList.contains('big')?3:el.classList.contains('gpu')?2:1;
  items.sort((a,b)=>pri(b.element)-pri(a.element)||((a.element.__occ>=2)-(b.element.__occ>=2)));
  const kept=[];
  items.forEach(o=>{
    const el=o.element, r=el.getBoundingClientRect();
    const over=kept.some(k=>!(r.right<k.left+2||r.left>k.right-2||r.bottom<k.top+2||r.top>k.bottom-2));
    if(!over) kept.push(r);
    const op=over?0:(el.__occ>=2?0.3:1);
    if(el.__op!==op){ el.__op=op; el.style.opacity=op; }
  });
}

 [ {t:'먼저, 무엇을 계산하나',d:`AI 계산은 대부분 숫자 표 두 개를 곱하는 일(<b>행렬 곱셈</b>)입니다. 결과 표 C의 칸 하나를 채우려면 <b>A의 가로줄 하나</b>와 <b>B의 세로줄 하나</b>에서 같은 순서의 숫자끼리 곱해서 모두 더합니다. 3D에서 색이 칠해지고 이름표가 붙은 줄이 그 두 줄입니다. 흰 칸은 지금 곱하고 있는 숫자 한 쌍입니다. 줄 하나에 숫자가 8개라서 C의 한 칸을 채우려면 곱셈이 8번 필요합니다.`,cam:{p:[-6.4,22,20],t:[-6.4,0,0.8]},go:()=>cset(1)},
   {t:'CPU: 빠른 일꾼 8명',d:`CPU 안에는 일꾼(코어)이 8명 있습니다. 이 8명이 C의 첫 줄 8칸을 한 칸씩 나눠 맡습니다. 주황 선이 누가 어느 칸을 맡았는지 보여 줍니다. 시계가 한 번 째깍할 때(1틱)마다 일꾼 한 명이 곱셈을 하나 합니다. 한 칸에 곱셈이 8번이니 첫 줄을 다 채우는 데 8틱이 걸립니다. 줄이 8개라 전부 하면 64틱입니다. 지금 화면은 4틱이 지난 모습이라, 칸마다 8번 중 4번까지 곱했습니다.`,cam:{p:[-6.4,22,20],t:[-6.4,0,0.8]},go:()=>cset(4)},
   {t:'GPU: 느린 일꾼 64명',d:`GPU의 일꾼 한 명은 CPU보다 느려서 곱셈 하나에 2틱이 걸립니다. 대신 64명이라 C의 64칸을 한 명씩 <b>동시에</b> 맡습니다. 같은 8틱이 지났을 때 CPU는 첫 줄만 끝냈습니다. GPU는 64칸 모두 곱셈을 절반(8번 중 4번)까지 해 놓았습니다.`,cam:{p:[6.4,22,20],t:[6.4,0,0.8]},go:()=>cset(8)},
   {t:'처음부터 끝까지',d:`처음부터 끝까지 돌려 보세요. CPU는 64틱, GPU는 16틱에 끝납니다. 일꾼 한 명만 보면 CPU가 2배 빠르지만, GPU는 일꾼이 8배 많아서 4배 먼저 끝납니다. 이렇게 나눠서 할 수 있는 것은 칸마다 쓰는 재료(가로줄·세로줄)가 정해져 있기 때문입니다. 일꾼끼리 서로 기다릴 일이 없습니다.`,cam:{p:[0,26,23],t:[0,0,0.2]},go:()=>crun()},
   {t:'실제 차이는 훨씬 크다',d:`그림은 이해하기 쉽게 줄인 것입니다. 실제 서버 CPU의 일꾼은 수십~백여 명이고, A100 GPU에는 ${gl('[[CUDA 코어]]')}가 6,912개 있습니다. 게다가 ${gl('[[텐서 코어]]')}는 작은 표를 통째로 한 번에 곱합니다. 그래서 그림의 4배 차이가 실제로는 수십~수백 배로 벌어집니다.`,go:()=>cset(CPU_TICKS)},
   {t:'학습과 추론',d:`AI를 쓰는 일은 두 단계로 나뉩니다. 공부에 비유하면 ${gl('[[학습]]')}은 문제집을 풀며 공부하는 단계, ${gl('[[추론]]')}은 시험에서 답을 쓰는 단계입니다.<br><b>학습</b>: 예제를 수없이 보여 주고, 얼마나 틀렸는지 보고, 고칠 방향(${gl('[[기울기]]')})을 계산해 모델 안의 숫자(${gl('[[가중치]]')})를 조금씩 고칩니다. 고치는 규칙을 ${gl('[[옵티마이저]]')}라고 합니다. 위의 곱셈을 셀 수 없이 되풀이하고 기억할 것도 많아서, GPU 여러 장을 묶어 몇 주씩 돌립니다.<br><b>추론</b>: 다 배운 모델에 질문을 넣고 답만 받습니다. 숫자를 고치지 않으니 질문 하나에 드는 계산이 훨씬 작습니다.`,go:()=>cset(CPU_TICKS),extra:()=>`<button class="linkbtn" data-compare="train">학습과 추론 비교표 ›</button>`} ],
 [ {t:'GPU 서버는 크게 두 종류',d:`왼쪽은 GPU 카드를 슬롯에 꽂는 서버, 오른쪽은 GPU를 전용 보드에 박아 넣은 서버입니다. 오른쪽 보드를 ${gl('[[HGX]]')}라고 하고, NVIDIA가 이 보드로 직접 만든 완성품 서버가 ${gl('[[DGX]]')}입니다. 상자를 누르거나 아래 버튼으로 안을 열어 보세요.`,set:{form:'overview',air:false},
     extra:()=>`<div class="mini"><table class="t"><thead><tr><th></th><th>카드형</th><th>SXM</th></tr></thead><tbody><tr><td>설치</td><td>슬롯에 꽂음</td><td>GPU 보드에 박음</td></tr><tr><td>GPU끼리</td><td>PCIe, 일부만 브리지</td><td>NVSwitch로 전부</td></tr><tr><td>주 용도</td><td>추론, 소규모 학습</td><td>대규모 학습</td></tr></tbody></table></div><div class="picks"><button class="actbtn" data-pick="card">카드형 열어 보기</button><button class="actbtn" data-pick="sxm">SXM 열어 보기</button></div>`},
   {t:'카드형 서버를 열면',d:`부품이 조립 순서대로 들어갑니다. 메인보드 위에 CPU와 메모리가 있고, 슬롯에는 GPU가 꽂힙니다. 한쪽에는 전원 장치(${gl('[[PSU]]')})가, 앞쪽에는 팬이 있습니다. 서버를 관리하는 작은 칩인 ${gl('[[BMC]]')}도 있습니다. 부품을 누르면 아래에 설명이 나옵니다.`,set:{form:'card',air:false,lid:true,explode:0},reveal:true},
   {t:'공기가 지나는 길',d:`앞쪽 팬이 찬 공기를 빨아들여 CPU와 GPU를 지나 뒤로 밀어냅니다. GPU 서버는 열이 많이 나서, 팬 하나만 멈춰도 GPU가 뜨거워집니다. 그러면 GPU가 스스로 속도를 낮추는데, 이것을 스로틀링이라고 합니다.`,set:{form:'card',air:true,lid:true},cam:{p:[24,12,6],t:[0,1.5,0]}},
   {t:'관리용 길: BMC와 OOB',d:`BMC는 서버 본체가 꺼져 있어도 켜져 있는 작은 컴퓨터입니다. 뒤쪽 전용 포트로 관리망(${gl('[[OOB]]')})에 연결하는데, 이 망은 업무망과 분리되어 있습니다. 이 길로 원격에서 전원을 켜고 끄고, 온도와 팬 상태를 봅니다.`,set:{form:'card',air:false,lid:true},view:'mgmt',cam:{p:[10,15,24],t:[-0.5,0.5,6]}},
   {t:'SXM 서버를 열면',d:`GPU 8장이 보드에 납작하게 박혀 있습니다. 가운데 ${gl('[[NVSwitch]]')} 6개가 모든 GPU를 서로 이어 줍니다. 보드 위 파란 선이 그 NVLink 배선입니다. GPU마다 NVSwitch 6개로 선이 하나씩 갑니다. 선 하나에 링크가 2개씩 들어 있어서 GPU 한 장에 링크가 모두 12개입니다. CPU가 있는 보드와는 PCIe 케이블로 연결됩니다. 전력이 큰 구성이라 대규모 학습에 씁니다.`,set:{form:'sxm',air:false},reveal:true} ],
 [ {t:'PCIe는 도로다',d:`${gl('[[PCIe]]')}는 GPU 같은 장치와 CPU를 잇는 도로입니다. ${gl('[[레인]]')} 수는 차로가 몇 개인지, 세대는 제한 속도라고 생각하면 됩니다. 지금은 GPU2에서 CPU 0까지 Gen4 x16 도로로 데이터가 가고 있습니다.`,set:{gen:4,lanes:16}},
   {t:'차로를 줄이면',d:`x4로 줄이면 길이 가늘어져서 한 번에 1/4만 나릅니다. 한 방향 약 32 GB/s가 8 GB/s로 줄어듭니다. 점이 느려진 걸 보세요.`,set:{gen:4,lanes:4}},
   {t:'세대를 올리면',d:`Gen5는 레인 하나가 Gen4보다 두 배 빠릅니다. 그래서 같은 x16이라도 한 방향 약 64 GB/s가 됩니다. 세대가 하나 오를 때마다 두 배씩 늘어납니다.`,set:{gen:5,lanes:16}},
   {t:'합류 지점: PCIe 스위치',d:`GPU0과 GPU1은 ${gl('[[PCIe 스위치]]')}에서 CPU로 가는 길 하나를 나눠 씁니다. 둘이 동시에 CPU 쪽으로 보내면 각자 절반씩밖에 못 씁니다. 고속도로 합류 구간과 같습니다.`,set:{gen:4,lanes:16},view:'bottleneck',cam:{p:[-1,12,13],t:[-6.4,0.5,-1.5]}},
   {t:'내 서버에서 확인하기',d:`어떤 장치가 어느 스위치 아래 있는지, GPU가 지금 몇 세대·몇 레인으로 붙어 있는지는 아래 명령으로 바로 볼 수 있습니다. GPU가 쉬고 있을 때는 전력을 아끼려고 세대가 낮게 보이기도 합니다.`,set:{gen:4,lanes:16},extra:()=>`<pre class="cmd">lspci -tv
nvidia-smi --query-gpu=pcie.link.gen.current,pcie.link.width.current --format=csv</pre>`} ],
 [ {t:'CPU가 둘이면 땅이 나뉜다',d:`2소켓 서버는 CPU마다 자기 메모리와 PCIe 장치를 따로 가집니다. 바닥 색이 같은 쪽이 한 ${gl('[[NUMA]]')} 노드입니다. GPU0~2는 CPU 0 쪽, GPU3은 CPU 1 쪽에 있습니다.`,view:'floor'},
   {t:'가까운 길과 먼 길',d:`같은 GPU3으로 보내도 CPU 1에서 보내면 바로 갑니다. CPU 0에서 보내면 소켓 간 연결을 건너야 합니다. 두 길을 나란히 보면 먼 길의 점이 훨씬 느립니다.`,view:'race'},
   {t:'해결: 가까운 CPU에 붙이기',d:`작업을 그 작업이 쓰는 GPU와 같은 노드의 CPU에서 돌리면 됩니다. 이렇게 붙이는 것을 ${gl('[[affinity]]')}라고 합니다. nvidia-smi topo -m의 NUMA Affinity 열로 노드를 확인하고, 아래처럼 numactl로 붙입니다.`,set:{numaCpu:1,numaGpu:3},extra:()=>`<pre class="cmd">numactl --cpunodebind=1 --membind=1 python train.py</pre>`},
   {t:'AMD는 한 소켓도 나뉠 수 있다',d:`AMD EPYC는 BIOS의 ${gl('[[NPS]]')} 설정으로 소켓 하나를 NUMA 노드 2개나 4개로 나눕니다. 그러면 같은 CPU에 붙은 GPU끼리도 먼 길(SYS)로 보일 수 있습니다. 왼쪽에서 CPU와 GPU를 직접 바꿔 보세요.`,set:{numaCpu:0,numaGpu:3}} ],
 [ {t:'같은 데이터, 두 개의 길',d:`GPU0에서 GPU1로 같은 데이터를 보냅니다. 위쪽은 ${gl('[[NVLink 브리지]]')}로 가는 길, 아래쪽은 PCIe 스위치를 거치는 길입니다. NVLink 쪽 점이 훨씬 빠르고 촘촘합니다. 이 그림 기준으로 약 4배(200 대 50 GB/s) 차이가 납니다.`,set:{mode:'card',bridge:true,sel:[0,1]},view:'race',cam:{p:[3,14,18],t:[-6.4,1.4,0.5]}},
   {t:'카드형: 브리지로 두 장씩',d:`카드형 GPU는 윗면 단자에 브리지를 끼운 두 장끼리만 NVLink로 이어집니다. 나머지 쌍은 PCIe로 다닙니다. 왼쪽에서 브리지를 빼 보세요.`,set:{mode:'card',bridge:true,sel:[0,1]}},
   {t:'SXM: NVSwitch로 여덟 장 모두',d:`SXM 서버는 GPU 8장의 NVLink가 모두 NVSwitch로 모입니다. 보드 위 파란 선들이 그 배선입니다. 그래서 어느 두 장을 골라도 속도가 같습니다. A100은 GPU마다 링크가 12개라서 NV12로 표시됩니다.`,set:()=>({mode:'sxm',mig:NOMIG(),sel:[0,6]})},
   {t:'표로 읽기',d:`nvidia-smi topo -m은 GPU 쌍마다 어떤 길로 통신하는지 코드로 보여 줍니다. NV가 붙으면 NVLink입니다. PIX부터 SYS까지는 PCIe이고, 뒤로 갈수록 먼 길입니다. 왼쪽에서 코드를 하나씩 골라 보세요. 전체 표는 오른쪽 "자세히"에 있습니다.`,set:{mode:'card',bridge:true,sel:[0,3]}},
   {t:'두 장을 묶는다면',d:`왼쪽 목록과 상황판을 보고 골라 보세요.`,set:{mode:'card',bridge:true,sel:[0,1]},ask:{q:'이 카드형 서버에서 GPU 2장으로 학습한다면 어떤 쌍이 좋습니까?',opts:['GPU0 + GPU1 (NV4)','GPU0 + GPU2 (NODE)','GPU0 + GPU3 (SYS)'],a:0,ex:'NVLink로 이어진 쌍이 가장 빠릅니다. SYS 쌍은 소켓을 건너야 해서 가장 느립니다.'}} ],
 [ {t:'P2P: GPU끼리 바로',d:`${gl('[[P2P]]')}가 되면 GPU0의 데이터가 스위치에서 바로 GPU1로 건너갑니다. CPU 메모리에 내려놓지 않습니다. 이 단계에서는 브리지를 빼고 PCIe만 봅니다.`,set:{p2pPair:1,p2p:true,acs:false}},
   {t:'P2P가 꺼지면',d:`데이터가 CPU 메모리까지 올라갔다가 다시 내려옵니다. GPU0에서 메모리로 한 번, 메모리에서 GPU1로 한 번, 모두 <b>두 번 복사</b>합니다. 길도 길어지고 CPU 메모리 대역폭도 잡아먹습니다.`,set:{p2pPair:1,p2p:false,acs:false}},
   {t:'ACS 때문에 막히는 경우',d:`가상머신이나 보안 설정에서 ${gl('[[ACS]]')}가 켜지면 스위치 안의 지름길이 막힙니다. 그러면 드라이버가 P2P를 끄고 메모리를 거쳐 복사합니다. 고장 난 것이 아니고 설정 문제입니다.`,set:{p2pPair:1,p2p:true,acs:true}},
   {t:'소켓을 건너면',d:`GPU0과 GPU3처럼 소켓을 건너는 쌍은 P2P를 지원하지 않는 경우가 많습니다. 이때도 CPU 메모리를 거칩니다.`,set:{p2pPair:3,p2p:true,acs:false}},
   {t:'GPUDirect 가족',d:`${gl('[[GPUDirect]]')}는 CPU 메모리를 건너뛰는 기술들을 묶어 부르는 이름입니다. P2P는 같은 서버의 GPU끼리 바로 주고받습니다. RDMA는 네트워크 카드를 거쳐 다른 서버의 GPU와 주고받는데, 2부에서 다시 나옵니다. Storage는 디스크에서 GPU로 바로 읽습니다.`,set:{p2pPair:1,p2p:true,acs:false}} ],
 [ {t:'GPU 한 장, 작업 하나',d:`MIG를 끄면 GPU 한 장을 작업 하나가 통째로 씁니다. 작은 추론 작업이라면 GPU 대부분이 놀게 됩니다.`,set:{migOn:false,migFault:false,migModel:'a100-80'}},
   {t:'칸막이를 내리면',d:`${gl('[[MIG]]')}를 켜면 하드웨어 칸막이가 내려와서 연산 7조각과 메모리를 나눕니다. 1g씩 나누면 서로 완전히 분리된 GPU 7개가 됩니다.`,set:{migOn:true,migPreset:'1x7',migFault:false},go:()=>{ migDrop=true; }},
   {t:'크기를 섞어서',d:`이름은 이렇게 읽습니다. 4g.40gb는 연산 4조각과 메모리 40GB라는 뜻입니다. 큰 작업에는 4g, 작은 작업에는 1g처럼 크기를 섞어 나눌 수 있습니다. 연산은 7조각인데 메모리는 8칸이라서, 3g와 4g는 메모리를 절반씩 받습니다.`,set:{migOn:true,migPreset:'4-2-1',migFault:false},go:()=>{ migDrop=true; }},
   {t:'옆 칸에 번지지 않는다',d:`한 인스턴스에서 문제가 나도 다른 인스턴스는 그대로 돕니다. 성능도 서로 빼앗지 않습니다. 시분할이나 MPS는 GPU를 함께 쓰기 때문에, 한 작업의 문제가 다른 작업에도 영향을 줍니다.`,set:{migOn:true,migPreset:'4-2-1',migFault:true}},
   {t:'나눠 쓰는 네 가지 방법',d:`MIG는 하드웨어로 칸을 막아 나눕니다. vGPU는 가상머신마다 GPU를 나눠 주는 소프트웨어고, 시분할은 번갈아 쓰는 방식, MPS는 동시에 같이 쓰는 방식입니다(오류 격리가 약함). 여러 팀이 안전하게 나눠 써야 한다면 MIG가 맞습니다.`,set:{migOn:true,migPreset:'4-2-1',migFault:false},extra:()=>`<button class="linkbtn" data-compare="share">네 가지 비교표 ›</button>`} ]
];

Object.assign(GLOSS,{
  'InfiniBand':'HPC와 AI 클러스터용 고속 네트워크입니다. 지연이 아주 낮고, 데이터를 잃지 않도록 설계됐습니다.',

let coll=null;

function collState(k){
  const c=Array.from({length:RN},()=>Array(RN).fill(1));
  for(let s=0;s<Math.min(k,RN-1);s++){ const snd=[]; for(let i=0;i<RN;i++){ const ch=((i-s)%RN+RN)%RN; snd.push([i,ch,c[i][ch]]); } snd.forEach(([i,ch,v])=>{ c[(i+1)%RN][ch]+=v; }); }
  for(let s=0;s<k-(RN-1);s++){ for(let i=0;i<RN;i++){ const ch=((i+1-s)%RN+RN)%RN; c[(i+1)%RN][ch]=RN; } }
  return c;
}
function collSends(k){ /* k번째 단계(1부터)에서 각 GPU가 보내는 조각 */
  if(k<1||k>RSTEPS) return [];
  const s=k-1, out=[];
  for(let i=0;i<RN;i++) out.push([i,(k<=RN-1)?((i-s)%RN+RN)%RN:((i+1-(s-(RN-1)))%RN+RN)%RN]);
  return out;
}

  coll.meshLines=cableLines(mp,0x4a9be0,0.035,.7); world.add(coll.meshLines);

  coll.tensorLabel=label('서버 1대 · NVLink로 묶은 GPU 8장',0,3.2,-8.4,'big','sxm');
  coll.boxes.pipeline=[]; coll.pipeLabels=[];
  for(let g=0;g<4;g++){ const a=ringPos(g*2), b=ringPos(g*2+1), c=a.clone().lerp(b,0.5); const m=new THREE.Mesh(new THREE.BoxGeometry(5.6,2.4,5.6),glassMat(.1)); m.position.set(c.x,1.2,c.z); m.rotation.y=-Math.atan2(b.z-a.z,b.x-a.x); world.add(m); coll.boxes.pipeline.push(m); coll.pipeLabels.push(label('서버 '+'ABCD'[g]+' · 단계 '+(g+1),c.x*1.25,3.0,c.z*1.25,'','sxm')); }

function renderColl(){
  if(!coll) return;
  const st=collState(coll.step);
  for(let i=0;i<RN;i++) for(let c=0;c<RN;c++){
    const m=coll.chunks[i][c], v=st[i][c], h=0.25+v/RN*2.2, full=v>=RN;
    m.scale.y=h; m.position.copy(m.userData.base).setY(h/2);
    m.material.color.setHex(CHUNK[c]).lerp(new THREE.Color(full?0xffffff:0x3a3d42),full?0.25:0.6*(1-v/RN));
  }
}
function collAction(act){
  if(!coll) return;
  if(act==='c2run'){ if(coll.step>=RSTEPS) coll.step=0; coll.running=!coll.running; coll.last=0; if(coll.running&&reduce){ coll.step=RSTEPS; coll.running=false; } }
  else if(act==='c2step'){ coll.running=false; if(coll.step<RSTEPS) collAdvance(); }
  else if(act==='c2reset'){ coll.running=false; coll.step=0; coll.anim=null; coll.packets.forEach(p=>p.visible=false); }
  renderColl(); renderLive(); renderLeft();
}
function collAdvance(){
  coll.step++;
  if(!reduce) coll.anim={t0:performance.now(),sends:collSends(coll.step)};
  renderColl(); renderLive();
}

function part2Tick(now,dt){
  part3Tick(now,dt);
  if(dpuRefs&&curScene&&curScene.startsWith('dpu')) dpuRefs.tasks.forEach(t=>{ const tg=dpuOff(t.i)?t.away:t.home; t.m.position.lerp(tg,reduce?1:Math.min(1,dt*3)); });
  if(fac&&curScene==='facility'&&S.cool==='air'&&!reduce){
    fac.cold.forEach(m=>{ m.position.z-=dt*3; if(m.position.z<1.9) m.position.z=7; });
    fac.hot.forEach(m=>{ m.position.z-=dt*3; if(m.position.z<-7) m.position.z=-1.9; });
  }
  if(coll&&curScene==='collective'){
    if(coll.running&&now-coll.last>(S.slow?1500:850)){ coll.last=now; if(coll.step<RSTEPS) collAdvance(); else { coll.running=false; renderLeft(); } }
    if(coll.anim){
      const p=Math.min(1,(now-coll.anim.t0)/(S.slow?1100:600));
      coll.anim.sends.forEach(([i,ch],n)=>{ const s=coll.packets[n], a=ringPos(i,6.9,0), b=ringPos(i+1,6.9,0), m=a.clone().lerp(b,p); m.y=1.3+Math.sin(p*Math.PI)*1.2; s.position.copy(m); s.material.color.setHex(CHUNK[ch]); s.visible=p<1; });
      if(p>=1) coll.anim=null;
    }
  }
}
function part2Paths(st,v){

  }
  if(st===10&&fac&&S.cool==='liquid'){
    addPath([V(3.8,1.0,0.6),V(2.4,1.0,0.6),V(2.4,7.4,0.6),V(1.7,7.4,0.6)],new THREE.Color(0x5ab4ff),0.35,0.12,'찬 냉각수');

  }

  quiz:{q:'랙 하나에 DGX H100(약 10.2 kW)을 4대 넣으면 어떻게 됩니까?',opts:['약 10 kW라 공랭으로 넉넉합니다','약 41 kW로, NVIDIA 공랭 설계가 잡는 랙당 최대 수준입니다','약 400 kW가 됩니다'],a:1,ex:'10.2 × 4 ≈ 41 kW입니다. NVIDIA의 공랭 데이터센터 설계는 랙당 DGX H100 4대를 기준으로 하고, 더 넣으려면 수랭이 필요합니다.'}},
{ part:'2부', title:'분산 학습과 집합 통신', scene:'collective', dom:['A1','A2','P'], badges:[A1,A2,P2], cam:null,
  goals:['GPU끼리 왜 통신해야 하는지 설명할 수 있습니다','링 all-reduce가 어떻게 진행되는지 압니다','데이터·텐서·파이프라인 병렬이 각각 어떤 길을 쓰는지 알게 됩니다'],
  key:['GPU마다 계산한 기울기를 합쳐야 모든 GPU가 같은 모델을 유지합니다. 이렇게 합치는 통신이 all-reduce입니다.','링 방식은 옆 GPU로 조각 하나씩만 넘기면서 2(N−1)번 만에 끝냅니다. 그래서 길 하나하나를 고르게 씁니다.','층을 쪼개는 텐서 병렬은 서버 안 NVLink에 두고, 층 묶음을 나누는 파이프라인 병렬은 서버 간 네트워크에 둡니다.'],
  body:()=>`<div class="sec"><h3>병렬 방식 3가지</h3><div class="tbl">${COMPARE.parallel.html}</div></div>
   <div class="sec"><h3>측정하기 (nccl-tests)</h3><pre class="cmd">all_reduce_perf -b 8 -e 8G -f 2 -g 8</pre><p class="note">GPU 8장으로 8바이트부터 8GB까지 크기를 두 배씩 늘리면서 all-reduce 속도(busbw)를 잽니다. 같은 서버끼리 값이 크게 다르면 NVLink나 NIC 문제를 의심해 보세요.</p>
   <pre class="cmd">NCCL_DEBUG=INFO</pre><p class="note">이 환경 변수를 켜고 실행하면 NCCL이 NVLink, PCIe, 네트워크 중 어떤 길을 골랐는지 로그에 남깁니다.</p></div>`,
  live:()=>{ const k=coll?coll.step:0, ph=k===0?'시작 전':k<=RN-1?`1단계 reduce-scatter (${k}/${RN-1})`:k<RSTEPS?`2단계 all-gather (${k-(RN-1)}/${RN-1})`:'완료';
    const txt=k===0?'GPU마다 자기 기울기 8조각을 갖고 있습니다. 막대가 낮을수록 아직 자기 값만 들어 있다는 뜻입니다.':k<=RN-1?'GPU마다 옆 GPU로 조각 하나를 보내고, 받은 조각에 자기 값을 더합니다. 7번이 끝나면 GPU마다 다 합쳐진 조각이 하나씩 생깁니다.':k<RSTEPS?'다 합쳐진 조각을 링을 따라 돌려서 모든 GPU에 나눠 줍니다.':'모든 GPU가 다 합쳐진 기울기 8조각을 똑같이 갖게 됐습니다. 이제 모두 같은 값으로 가중치를 고칩니다.';
    return `<div class="readout"><div class="sub">링 all-reduce · GPU ${RN}장 · ${ph}</div><div>단계 <span class="big">${k}</span> / ${RSTEPS}</div>
      <div class="hbar"><i style="width:${k/RSTEPS*100}%;background:var(--nv)"></i></div>
      <div class="sub">${txt}</div><div class="sub">GPU 하나가 지금까지 보낸 양은 전체 기울기의 ${k}/${RN}입니다. 끝나면 ${RSTEPS}/${RN}, 약 1.75배가 됩니다.</div></div>`; },
  compare:['parallel'],
  quiz:{q:'텐서 병렬을 보통 서버 한 대 안(NVLink 범위)에서 하는 이유는 무엇입니까?',opts:['층 하나를 쪼개서 GPU끼리 통신이 아주 잦기 때문','메모리를 덜 써서','서버에 네트워크 카드가 없어서'],a:0,ex:'텐서 병렬은 층마다 결과를 여러 번 주고받습니다. 그래서 네트워크보다 훨씬 빠른 NVLink 안에 둬야 느려지지 않습니다.'}}
);

SLIDES.push(
 [ {t:'서버 밖으로 나가는 길',d:`모델이 커서 학습을 서버 여러 대로 나누면, GPU가 서버를 넘어 다른 서버의 GPU와 통신해야 합니다. 서버끼리 오가는 이 통신을 ${gl('[[동서 트래픽]]')}이라고 합니다. AI 학습 통신은 대부분 여기에 속합니다. 사용자와 서버 사이를 오가는 것은 ${gl('[[남북 트래픽]]')}입니다.`,set:{rdma:true,fabric:'ib',ibGen:'ndr'}},
   {t:'GPU 한 장에 NIC 한 장',d:`DGX H100은 GPU 8장 옆에 ${gl('[[ConnectX]]')}-7 ${gl('[[NIC]]')} 8장을 붙입니다. GPU마다 자기 NIC가 있어서, 8장이 동시에 다른 서버로 보내도 길이 막히지 않습니다.`,set:{rdma:true},view:'rail'},
   {t:'GPUDirect RDMA: CPU 메모리를 건너뛰기',d:`초록 길을 보세요. ${gl('[[RDMA]]')}로 GPU 메모리에서 NIC로 바로 갑니다. 빨간 길은 양쪽 서버에서 CPU 메모리를 한 번씩 거칩니다. 복사가 늘고 길도 길어서 점이 훨씬 느리게 움직입니다.`,view:'race'},
   {t:'InfiniBand와 이더넷',d:`${gl('[[InfiniBand]]')}는 HPC·AI용으로 만든 네트워크라서 데이터를 잃지 않고 지연이 아주 낮습니다. 이더넷도 ${gl('[[RoCE]]')}로 RDMA를 쓸 수 있습니다. 다만 데이터를 잃지 않도록 설정을 따로 맞춰야 합니다. 왼쪽에서 종류를 바꿔 보세요.`,set:{rdma:true}},
   {t:'속도 세대와 단위',d:`속도는 HDR 200, NDR 400, XDR 800 Gb/s처럼 세대마다 두 배씩 올라갑니다. 네트워크는 소문자 b(비트)로 세기 때문에 400 Gb/s는 한 방향 50 GB/s입니다. H100 NVLink는 GPU당 한 방향 450 GB/s(양방향 900 GB/s)라서, 네트워크가 9배쯤 느립니다. 그래서 통신이 잦은 일은 서버 안에 둡니다.`,set:{rdma:true,ibGen:'ndr'}},
   {t:'케이블과 트랜시버',d:`몇 미터 안의 가까운 거리는 양끝에 단자가 붙은 구리 케이블(${gl('[[DAC]]')})을 씁니다. 먼 거리는 ${gl('[[트랜시버]]')}와 광 케이블을 씁니다. 케이블이 불량이거나 덜 꽂히면 링크 속도가 떨어지거나 연결이 끊깁니다.`,view:'cables',cam:{p:[0,9,14],t:[0,1,-1]}} ],
 [ {t:'CPU가 하는 잡일',d:`서버 CPU는 앱만 돌리는 것이 아닙니다. 네트워크 패킷 처리, 스토리지 접근, 암호화, 방화벽 같은 인프라 일에도 코어를 씁니다. 지금은 이 네 가지 일이 모두 CPU 위에 있습니다.`,set:{nicType:'nic',offload:false}},
   {t:'일반 NIC는 대신 못 한다',d:`일반 NIC는 패킷을 주고받기만 합니다. 그래서 오프로드를 켜도 일이 옮겨 가지 않습니다.`,set:{nicType:'nic',offload:true}},
   {t:'DPU로 넘기기',d:`${gl('[[DPU]]')}는 네트워크 카드에 Arm 코어와 가속기를 얹은 칩입니다. 오프로드를 켜면 네 가지 일이 DPU로 옮겨 갑니다. 이렇게 일을 넘기는 것을 ${gl('[[오프로드]]')}라고 합니다. CPU는 그만큼 코어를 앱에 쓰게 됩니다.`,set:{nicType:'dpu',offload:true}},
   {t:'SuperNIC는 통신에 집중',d:`${gl('[[SuperNIC]]')}는 GPU 서버 사이 통신에 특화된 카드입니다. 네트워크 처리는 맡지만, 스토리지·보안까지 넘겨받는 DPU와는 역할이 다릅니다.`,set:{nicType:'super',offload:true}},
   {t:'서버와 분리된 보안 영역',d:`DPU는 서버 OS와 분리된 자기 환경에서 돕니다. 그래서 서버가 뚫려도 DPU에 건 방화벽과 접근 정책은 그대로 남습니다. 여러 고객이 함께 쓰는 클라우드에서 고객 사이 경계를 나누는 데 씁니다.`,set:{nicType:'dpu',offload:true},view:'secure'} ],
 [ {t:'클러스터를 이루는 것',d:`클러스터는 계산 노드 랙 여러 개와 관리 노드, 스토리지로 이뤄집니다. 관리 노드는 작업을 나눠 주고 관리하고, 스토리지는 데이터를 담습니다. 위쪽의 리프·스파인 스위치가 계산 노드들을 이어 줍니다.`,set:{netCompute:true,netStorage:false,netMgmt:false,netOob:false,rail:false}},
   {t:'네트워크는 용도별로 나뉜다',d:`학습 통신은 계산 패브릭, 데이터 읽기·저장은 스토리지망으로 다닙니다. OS 설치와 작업 배포는 관리망, 전원·콘솔은 OOB로 따로 다닙니다. 이것이 섞이면 학습 통신이 느려지거나, 장애가 났을 때 서버에 들어갈 길이 사라집니다.`,set:{netCompute:true,netStorage:true,netMgmt:true,netOob:true,rail:false}},
   {t:'스파인-리프: 몇 단이면 어디든',d:`랙마다 ${gl('[[스파인-리프|리프 스위치]]')}를 두고, 모든 리프를 스파인에 연결합니다. 그러면 랙 1의 서버에서 랙 4의 서버까지 리프 → 스파인 → 리프, 스위치 세 번이면 닿습니다.`,set:{netCompute:true,netStorage:false,netMgmt:false,netOob:false,rail:false},view:'spine'},
   {t:'레일 최적화',d:`${gl('[[레일 최적화]]')}는 서버마다 같은 번호 GPU의 NIC를 같은 스위치에 모으는 배치입니다. 서버마다 NIC가 레일 스위치 전부에 하나씩 붙고, 같은 번호 NIC끼리 같은 스위치에 모입니다. 그래서 서버 A의 GPU1과 서버 D의 GPU1은 레일 1 스위치 한 번으로 닿습니다. 그림은 서버당 GPU·NIC를 4개로 줄였습니다. 분산 학습에서 GPU들이 결과를 합치는 통신(${gl('[[all-reduce]]')}, 2부 첫 단계에서 배웠습니다)은 같은 번호 GPU끼리 많이 오가서 이 배치가 유리합니다.`,set:{netCompute:true,netStorage:false,netMgmt:false,netOob:false,rail:true},view:'rail'},
   {t:'스토리지와 확장 단위',d:`학습 데이터와 체크포인트는 ${gl('[[병렬 파일시스템]]')}에 둡니다. 읽을 때는 계산망과 분리된 스토리지망을 씁니다. 실제 클러스터는 이런 묶음을 그대로 여러 번 반복해서 키웁니다. ${gl('[[SuperPOD]]')}에서 말하는 확장 단위가 이 묶음입니다.`,set:{netCompute:true,netStorage:true,netMgmt:false,netOob:false,rail:false},view:'storage'} ],
 [ {t:'서버를 쌓으면 전력이 쌓인다',d:`DGX H100 한 대가 최대 약 10.2 kW를 씁니다. 높이가 8U라서 42U 랙에는 많아야 5대까지 들어갑니다. 두 대만 넣어도 20 kW라서 일반 서버 랙 여러 개 몫입니다. 왼쪽에서 대수를 늘려 보세요.`,set:{rackN:2,srvType:'h100',cool:'air'}},
   {t:'전기는 모두 열이 된다',d:`랙 앞의 찬 공기 통로로 들어온 공기가 서버를 식히고, 뒤의 더운 공기 통로로 나갑니다. 두 통로의 공기가 섞이지 않게 막는 것이 공랭의 기본입니다.`,set:{rackN:3,cool:'air'}},
   {t:'공랭의 한계',d:`네 대를 넣으면 약 41 kW가 됩니다. NVIDIA의 공랭 데이터센터 설계도 랙당 DGX H100 4대를 기준으로 잡습니다. 그보다 많이 넣으면 공기로는 열을 다 빼지 못해 서버가 뜨거워지고 스스로 속도를 낮춥니다. 랙을 나누거나 수랭으로 바꿔야 합니다.`,set:{rackN:4,srvType:'h100',cool:'air'}},
   {t:'수랭: 물로 열을 가져간다',d:`칩에 붙인 냉각판으로 냉각수가 지나가며 열을 가져갑니다. ${gl('[[CDU]]')}는 그 물을 식혀 다시 보냅니다. 물은 공기보다 훨씬 많은 열을 옮깁니다. 그래서 GB200 NVL72처럼 랙 하나에 120 kW급 냉각이 필요한 구성도 가능합니다.`,set:{rackN:5,srvType:'h100',cool:'liquid'}},
